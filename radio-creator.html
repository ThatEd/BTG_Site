<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Radio Creator</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --rc-bg: var(--ink-deep);
    --rc-panel: var(--card);
    --rc-panel-raise: var(--card-raised);
    --rc-edge: var(--edge);
    --rc-edge-strong: var(--edge-strong);
    --rc-copy: var(--copy);
    --rc-copy-soft: var(--copy-soft);
    --rc-copy-faint: var(--copy-faint);
    --rc-accent: var(--ember);
  }
  @font-face {
    font-family: 'Octosquares';
    src: url('fonts/Octosquares-Trial-Black.ttf') format('truetype');
    font-weight: 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Formula1 Bold';
    src: url('fonts/Formula1-Bold_web_0 (1).ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Formula1 Regular';
    src: url('fonts/Formula1-Regular_web_0 (1).ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  .rc-wrap { padding-top: 1rem; }
  .rc-head h1 {
    font-family: var(--head-face);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 2px;
    color: var(--copy);
  }
  .rc-head .rc-sub { color: var(--copy-faint); font-size: 13px; margin: 0 0 18px; }
  .rc-app { display: flex; gap: 24px; flex-wrap: wrap; }
  .rc-controls { flex: 1 1 360px; min-width: 300px; }
  .rc-preview-area { flex: 1 1 300px; min-width: 280px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .rc-section {
    background: var(--rc-panel);
    border: 1px solid var(--rc-edge);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 12px;
  }
  .rc-section-title {
    font-size: 11px; font-weight: 700; color: var(--rc-copy-soft);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
    font-family: var(--head-face);
  }
  .rc-field { margin-bottom: 10px; }
  .rc-field label { display: block; font-size: 12px; color: var(--rc-copy-soft); margin-bottom: 4px; }
  .rc-field input, .rc-field textarea, .rc-field select {
    width: 100%; font-size: 13px; border: 1px solid var(--rc-edge-strong);
    border-radius: 6px; padding: 6px 10px; background: var(--ink);
    color: var(--copy); font-family: var(--body-face);
  }
  .rc-field textarea { resize: vertical; min-height: 70px; }
  .rc-series-tabs { display: flex; gap: 0; margin-bottom: 10px; border: 1px solid var(--rc-edge-strong); border-radius: 6px; overflow: hidden; }
  .rc-series-tab {
    flex: 1; font-size: 12px; padding: 7px; border: none; cursor: pointer;
    background: var(--ink); color: var(--rc-copy-soft);
    font-family: var(--head-face); text-transform: uppercase; font-weight: 700;
    transition: all 0.15s;
  }
  .rc-series-tab.active { background: var(--card-high); color: var(--copy); }
  .rc-team-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .rc-preset-btn {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
    border: 1px solid transparent; cursor: pointer; transition: transform 0.1s, opacity 0.1s;
    font-family: var(--head-face); text-transform: uppercase;
  }
  .rc-preset-btn:hover { opacity: 0.85; transform: scale(1.04); }
  .rc-preset-btn.active-preset { outline: 2px solid var(--copy); outline-offset: 1px; }
  .rc-driver-grid { display: flex; flex-wrap: wrap; gap: 5px; }
  .rc-driver-btn {
    font-size: 11px; padding: 3px 9px; border-radius: 20px; border: 1px solid transparent;
    cursor: pointer; transition: transform 0.1s, opacity 0.1s;
    font-family: var(--head-face); font-weight: 700; display: inline-flex; align-items: center; gap: 5px;
  }
  .rc-driver-btn:hover { opacity: 0.85; transform: scale(1.03); }
  .rc-driver-btn.active-driver { outline: 2px solid var(--copy); outline-offset: 1px; }
  .rc-driver-btn img { height: 11px; width: auto; border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; }
  .rc-msg-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .rc-toggle-btn {
    flex: 1; font-size: 12px; padding: 6px; border-radius: 6px;
    border: 1px solid var(--rc-edge-strong); cursor: pointer; background: var(--ink);
    color: var(--rc-copy-soft); font-family: var(--head-face); text-transform: uppercase;
    font-weight: 700; transition: all 0.15s;
  }
  .rc-toggle-btn.active { background: var(--card-high); color: var(--copy); border-color: var(--rc-accent); }
  .rc-download-btn {
    width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--rc-edge-strong);
    background: var(--ink); color: var(--copy); font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: var(--head-face); display: flex; align-items: center; justify-content: center;
    gap: 8px; text-transform: uppercase; transition: background 0.15s;
  }
  .rc-download-btn:hover { background: var(--card-high); }
  .rc-add-reply-btn {
    width: 100%; padding: 8px; border-radius: 6px; border: 1px dashed var(--rc-edge-strong);
    background: transparent; color: var(--rc-copy-soft); font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: var(--head-face); text-transform: uppercase; transition: all 0.15s;
    margin-bottom: 12px;
  }
  .rc-add-reply-btn:hover { border-color: var(--rc-accent); color: var(--copy); }
  .rc-reply-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .rc-reply-section-header .rc-section-title { margin-bottom: 0; }
  .rc-remove-reply-btn {
    font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--rc-edge-strong);
    background: transparent; color: var(--rc-copy-soft); cursor: pointer; font-family: var(--head-face);
    text-transform: uppercase; font-weight: 700; transition: all 0.15s;
  }
  .rc-remove-reply-btn:hover { border-color: #e8002d; color: #e8002d; }
  .rc-no-drivers { font-size: 12px; color: var(--rc-copy-faint); font-style: italic; }
  #repliesContainer { display: flex; flex-direction: column; gap: 0; }
  #previewCanvas { border-radius: 12px; flex-shrink: 0; display: block; background:#000; }
  .rc-hint { font-size: 12px; color: var(--rc-copy-faint); text-align: center; }
  @media (max-width: 720px) {
    #previewCanvas { width: 300px !important; height: 300px !important; }
  }
</style>
</head>
<body data-page="radio">

<nav class="btg-nav" id="btg-nav"></nav>

<div class="rc-wrap page-section" style="max-width:1200px;margin:0 auto;padding:0 16px 80px;">
  <div class="rc-head">
    <h1>Radio Creator</h1>
    <p class="rc-sub">Build and export square radio cards for every series with team presets, driver shortcuts, and custom color tuning.</p>
  </div>

  <div class="rc-app">
    <div class="rc-controls">

      <!-- Team / driver picker -->
      <div class="rc-section">
        <div class="rc-section-title">Series</div>
        <div class="rc-series-tabs" id="seriesTabs"></div>
        <div class="rc-section-title" style="margin-bottom:8px">Team Presets</div>
        <div class="rc-team-presets" id="presets"></div>
        <div id="driverSection">
          <div class="rc-section-title" style="margin:10px 0 8px">Driver Selector</div>
          <div class="rc-driver-grid" id="drivers"></div>
        </div>
      </div>

      <!-- Message 1 -->
      <div class="rc-section">
        <div class="rc-section-title">Message 1</div>
        <div class="rc-msg-toggle">
          <button class="rc-toggle-btn active" id="btn-driver" onclick="setMsgType('driver')">Driver Radio</button>
          <button class="rc-toggle-btn" id="btn-team" onclick="setMsgType('team')">Team Message</button>
        </div>
        <div class="rc-field"><textarea id="quoteText">I'm on the radio</textarea></div>
        <div id="sender-field" class="rc-field" style="display:none">
          <label>Sender</label>
          <input id="senderName" value="ENGINEER" />
        </div>
      </div>

      <!-- Replies -->
      <div id="repliesContainer"></div>
      <button class="rc-add-reply-btn" id="addReplyBtn" onclick="addReply()">+ Add Reply</button>

      <!-- Overrides -->
      <div class="rc-section">
        <div class="rc-section-title">Overrides</div>
        <div class="rc-field">
          <label>Car Number</label>
          <input id="carNumberField" value="" placeholder="e.g. 44" oninput="document.getElementById('carNumber').value=this.value.trim();render();" />
        </div>
        <div class="rc-field">
          <label>Driver Override (Roster)</label>
          <select id="driverOverrideSelect"><option value="">None</option></select>
        </div>
      </div>

      <!-- Hidden state -->
      <input type="hidden" id="driverName" value="HAMILTON" />
      <input type="hidden" id="carNumber" value="" />
      <input type="hidden" id="logoUrl" value="" />
      <input type="hidden" id="teamLabel" value="FERRARI" />
      <input type="hidden" id="bgColor" value="#1a0000" />
      <input type="hidden" id="accentColor" value="#e8002d" />
      <input type="hidden" id="teamMainColor" value="#e8002d" />
      <input type="hidden" id="numberColor" value="#e8002d" />
      <input type="hidden" id="stripeColor" value="#e8002d" />
      <input type="hidden" id="nameColor" value="#e8002d" />

      <button class="rc-download-btn" onclick="downloadCard()">Download Card</button>
    </div>

    <div class="rc-preview-area">
      <canvas id="previewCanvas" width="360" height="360"></canvas>
      <div class="rc-hint">360 × 360 preview (exports at 720 × 720)</div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="teams/f1.js"></script>
<script src="js/roster.js"></script>

<script>
/* ─── globals ─────────────────────────────────────────────── */
let TEAMS_BY_SERIES = {};
let DRIVERS_BY_SERIES = {};
let SERIES_LIST = [];

/* Roster team key → site logo file (exists under Site/logos). */
const TEAM_LOGO_MAP = {
  'Red Bull': 'logos/mini/Redbull.png',
  'Mercedes': 'logos/mini/Mercedes.png',
  'Ferrari': 'logos/mini/Ferrari.png',
  'McLaren': 'logos/mini/McLaren.png',
  'Aston Martin': 'logos/mini/AstonMartin.png',
  'Alpine': 'logos/mini/Alpine.png',
  'Williams': 'logos/mini/Williams.png',
  'Racing Bulls': 'logos/teams/Racing Bulls.png',
  'Sauber': 'logos/teams/kick-sauber.webp',
  'Haas': 'logos/mini/Haas.png',
  'F2 ART': 'logos/mini/f2/ArtGrandPrix.png',
  'F2 Prema': 'logos/mini/f2/PremaRacing.png',
  'F2 Rodin': 'logos/mini/f2/Carlin.png',
  'F2 DAMS': 'logos/mini/f2/Dams.png',
  'F2 Invicta': 'logos/mini/f2/VirtuosiRacing.png',
  'F2 MP': 'logos/mini/f2/MpMotorsport.png',
  'F2 VAR': 'logos/mini/f2/VanAmersfoortRacing.png',
  'F2 Hitech': 'logos/mini/f2/Hitech.png',
  'F2 Campos': 'logos/mini/f2/CamposRacing.png',
  'F2 Trident': 'logos/mini/f2/Trident.png',
};

/* Per-team text-colour overrides — only where a fully automatic choice reads
   badly (e.g. F2 Invicta's dark-grey secondary is useless, so its text is white). */
const TEXT_OVERRIDES = {
  'F2 Invicta': '#ffffff',
};


const F2_TEAM_ORDER = [
  'F2 ART', 'F2 Prema', 'F2 Rodin', 'F2 DAMS', 'F2 Invicta',
  'F2 MP', 'F2 VAR', 'F2 Hitech', 'F2 Trident', 'F2 Campos'
];

/* ─── ui state ───────────────────────────────────────────── */
let msgType    = 'driver';
let activeSeries  = '';
let activeTeamKey = null;
let ALL_DB_DRIVERS     = [];

// Replies array — each reply: { type:'driver'|'team', quote:'...', sender:'ENGINEER' }
let replies = [];

/* constants */
const NAME_REFERENCE  = 'SWANSSON';
const EXPORT_SIZE     = 720;
const DIVIDER_Y_RATIO = 5 / 12;

/* off-screen canvases for measuring */
const nameMeasureCanvas  = document.createElement('canvas');
const nameMeasureCtx     = nameMeasureCanvas.getContext('2d');
const quoteMeasureCanvas = document.createElement('canvas');
const quoteMeasureCtx    = quoteMeasureCanvas.getContext('2d');

/* off-screen canvas for the full-res render */
const offCanvas = document.createElement('canvas');
offCanvas.width  = EXPORT_SIZE;
offCanvas.height = EXPORT_SIZE;
const offCtx = offCanvas.getContext('2d');

const TEAM_LOGO_CACHE = new Map();
const LOGO_ART_CACHE = new Map(); // logo src → {top, bottom} of visible art (source px)

/* ─── colour helpers ─────────────────────────────────────── */
function darkenHex(hex, factor) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return '#' + [r,g,b].map(v => Math.round(v*factor).toString(16).padStart(2,'0')).join('');
}
function hexToRgb(hex) {
  return { r:parseInt(hex.slice(1,3),16), g:parseInt(hex.slice(3,5),16), b:parseInt(hex.slice(5,7),16) };
}
function hexToRgba(hex, alpha) {
  const c = hexToRgb(hex); return `rgba(${c.r},${c.g},${c.b},${alpha})`;
}
function rgbToHex(r,g,b) {
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
}

/* ── colour contrast helpers ────────────────────────────── */
function relativeLuminance(hex) {
  const { r, g, b } = hexToRgb(hex);
  const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}
function contrastRatio(a, b) {
  const la = relativeLuminance(a), lb = relativeLuminance(b);
  const hi = Math.max(la, lb), lo = Math.min(la, lb);
  return (hi + 0.05) / (lo + 0.05);
}
function hslOf(hex) {
  const { r, g, b } = hexToRgb(hex);
  const rn = r / 255, gn = g / 255, bn = b / 255;
  const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
  const l = (max + min) / 2;
  let h = 0, s = 0;
  if (max !== min) {
    const d = max - min;
    s = d / (1 - Math.abs(2 * l - 1));
    if (max === rn) h = ((gn - bn) / d) % 6;
    else if (max === gn) h = (bn - rn) / d + 2;
    else h = (rn - gn) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s, l };
}

/** Pick a readable text colour: prefer Color 2 when it reads well and isn't a
    dull mid-grey; otherwise Color 1; otherwise white. The 2.0 threshold keeps
    deep accent colours (e.g. ART red) while rejecting near-invisible greys. */
function bestTextColor(main, secondary, bg) {
  const { s, l } = hslOf(secondary);
  const crSecondary = contrastRatio(secondary, bg);
  const crMain = contrastRatio(main, bg);
  if (crSecondary >= 2.0 && !(s < 0.15 && l < 0.8)) return secondary;
  if (crMain >= 3.0) return main;
  return '#ffffff';
}

function waveFillColor(stripeHex, bgHex) {
  const {r,g,b} = hexToRgb(stripeHex);
  const rn=r/255, gn=g/255, bn=b/255;
  const max=Math.max(rn,gn,bn), min=Math.min(rn,gn,bn), delta=max-min;
  let h=0;
  if (delta!==0) {
    if (max===rn) h=((gn-bn)/delta)%6;
    else if (max===gn) h=(bn-rn)/delta+2;
    else h=(rn-gn)/delta+4;
    h*=60; if(h<0) h+=360;
  }
  const l=(max+min)/2, s=delta===0?0:delta/(1-Math.abs(2*l-1));
  const stripeL=l*100, stripeS=s*100;
  const bg=hexToRgb(bgHex);
  const bgL=(Math.max(bg.r,bg.g,bg.b)+Math.min(bg.r,bg.g,bg.b))/(2*255)*100;
  const isNeutral=stripeS<10;
  if (isNeutral) {
    const neutralL=stripeL<=28?Math.max(44,Math.min(76,stripeL*1.9+24)):Math.max(12,Math.min(24,stripeL*0.31));
    let adj=neutralL; const md=stripeL<=28?14:18;
    if (Math.abs(adj-bgL)<md) adj=bgL<50?Math.min(76,bgL+md):Math.max(12,bgL-md);
    return `hsl(0 0% ${Math.round(adj)}%)`;
  }
  const isVeryDark=stripeL<=28;
  let wH=h, wS, wL;
  if (!isVeryDark) {
    if (h>=150&&h<190) wH=(h+20)%360; else if (h>=190&&h<=240) wH=(h+7)%360;
    const bb=(h>=190&&h<=240)?8:0;
    wS=Math.max(22,Math.min(50,stripeS*0.44+bb)); wL=Math.max(12,Math.min(24,stripeL*0.31));
  } else {
    if (stripeS<10) { wH=0;wS=0;wL=Math.max(44,Math.min(76,stripeL*1.9+24)); }
    else { wH=(h+2)%360; wS=Math.max(20,Math.min(78,stripeS*0.62+8)); wL=Math.max(36,Math.min(72,stripeL*1.55+14)); }
  }
  const mcd=isVeryDark?14:18;
  if (Math.abs(wL-bgL)<mcd) wL=bgL<50?Math.min(isVeryDark?72:24,bgL+mcd):Math.max(isVeryDark?36:12,bgL-mcd);
  return `hsl(${Math.round(wH)} ${Math.round(wS)}% ${Math.round(wL)}%)`;
}

function withAlpha(color, alpha) {
  const hm=color.match(/hsl\(\s*([\d.]+)\s+([\d.]+)%\s+([\d.]+)%\s*\)/i);
  if (hm) return `hsla(${hm[1]}, ${hm[2]}%, ${hm[3]}%, ${alpha})`;
  const xm=color.match(/^#([\da-f]{6})$/i);
  if (xm) { const c=hexToRgb(color); return `rgba(${c.r},${c.g},${c.b},${alpha})`; }
  return color;
}

/* ─── text helpers ──────────────────────────────────────── */
function fittedNameSize(ctx, name, baseSize, fontFamily) {
  const n=(name||'DRIVER').toUpperCase();
  ctx.font=`700 ${baseSize}px ${fontFamily}`;
  const maxW=ctx.measureText(NAME_REFERENCE).width;
  const nW=ctx.measureText(n).width;
  if (nW<=maxW) return baseSize;
  return Math.max(baseSize*0.55, baseSize*(maxW/nW));
}

function getWrappedLines(ctx, text, maxW) {
  const words=text.split(' ');
  const lines=[];
  let line='';
  for (let i=0;i<words.length;i++) {
    const word=words[i];
    if (ctx.measureText(word).width > maxW) {
      if (line) { lines.push(line); line=''; }
      let charLine='';
      for (const char of word) {
        const test=charLine+char;
        if (ctx.measureText(test).width > maxW && charLine) {
          lines.push(charLine);
          charLine=char;
        } else {
          charLine=test;
        }
      }
      if (charLine) line=charLine;
    } else {
      const test=line+(line?' ':'')+word;
      if (ctx.measureText(test).width>maxW && line) { lines.push(line); line=word; }
      else line=test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function wrapTextCanvas(ctx, text, x, y, maxW, lineH) {
  const lines=getWrappedLines(ctx,text,maxW);
  lines.forEach(l=>{ ctx.fillText(l,x,y); y+=lineH; });
}

/* ─── logo helpers ──────────────────────────────────────── */
// Find the bounding box of the actually-visible art inside a logo file. Many
// logos ship with lots of transparent padding around the art, which makes them
// render much smaller (and float higher) than their filesize suggests.
function logoArtBounds(img) {
  const src = img && (img.currentSrc || img.src);
  if (src && LOGO_ART_CACHE.has(src)) return LOGO_ART_CACHE.get(src);
  let b = null;
  try {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (iw > 0 && ih > 0) {
      const c = document.createElement('canvas');
      c.width = iw; c.height = ih;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0);
      const d = ctx.getImageData(0, 0, iw, ih).data;
      let top = -1, bottom = -1, left = -1, right = -1;
      for (let y = 0; y < ih; y++) {
        const row = y * iw;
        for (let x = 0; x < iw; x++) {
          if (d[(row + x) * 4 + 3] > 8) {
            if (top === -1) top = y;
            bottom = y;
            if (left === -1 || x < left) left = x;
            if (x > right) right = x;
          }
        }
      }
      if (top !== -1) b = { top, bottom, left, right };
    }
  } catch (_) { /* fall back to full image below */ }
  if (!b) b = { top: 0, bottom: (img.naturalHeight || img.height || 1) - 1, left: 0, right: (img.naturalWidth || img.width || 1) - 1 };
  if (src) LOGO_ART_CACHE.set(src, b);
  return b;
}

function preloadTeamLogos() {
  TEAM_LOGO_CACHE.clear();
  Object.values(TEAMS_BY_SERIES).forEach(list => {
    list.forEach(team => {
      if (!team.logo) return;
      const img = new Image(); img.src = team.logo; TEAM_LOGO_CACHE.set(team.key, img);
    });
  });
}

function loadImage(url) {
  return new Promise((resolve,reject)=>{
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>resolve(img); img.onerror=()=>reject(new Error('load failed'));
    img.src=url;
  });
}

/* ─── seeded wave ───────────────────────────────────────── */
function seededRand(seed) {
  let s=seed>>>0; return ()=>{ s=(Math.imul(1664525,s)+1013904223)>>>0; return s/0x100000000; };
}
function computeSeed() {
  const combined=(document.getElementById('quoteText').value||'')
    +(document.getElementById('carNumber').value||'')
    +(document.getElementById('teamLabel').value||'')
    +(document.getElementById('teamMainColor').value||'');
  let h=0x811c9dc5;
  for (let i=0;i<combined.length;i++) { h^=combined.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  return h;
}
function generateBars(seed,count) {
  const rand=seededRand(seed);
  const hr=seededRand((seed^Math.imul(new Date().getHours()+1,2654435761))>>>0);
  const raw=[];
  for(let i=0;i<count;i++){
    const r=rand(); let v;
    if(r<0.12) v=0.08+rand()*0.10;
    else if(r<0.30) v=0.20+rand()*0.15;
    else if(r<0.55) v=0.38+rand()*0.20;
    else if(r<0.78) v=0.58+rand()*0.22;
    else v=0.80+rand()*0.20;
    raw.push(v);
  }
  const sm=raw.map((v,i)=>v*0.6+raw[(i-1+count)%count]*0.2+raw[(i+1)%count]*0.2);
  return sm.map((v,i)=>{ const t=i/(count-1); return v*(0.25+0.75*Math.sin(t*Math.PI))*0.7*(1+((hr()*2-1)*0.03)); });
}
function drawWave(ctx,W,H,color,bars) {
  const ZONE_H=H*0.415, FLOOR=Math.round(H*DIVIDER_Y_RATIO), SW=W/bars.length;
  ctx.save(); ctx.globalAlpha=1;
  for(let i=0;i<bars.length;i++){
    const bh=bars[i]*ZONE_H, yTop=Math.round(FLOOR-bh);
    const ss=Math.floor(i*W/bars.length), se=i===bars.length-1?W:Math.floor((i+1)*W/bars.length);
    const sw2=Math.max(1,se-ss), dw=Math.min(Math.max(1,Math.round(SW*1.4)),sw2);
    const x0=ss+Math.floor((sw2-dw)/2), x1=x0+dw;
    const grad=ctx.createLinearGradient(0,yTop,0,FLOOR);
    grad.addColorStop(0,withAlpha(color,0.2)); grad.addColorStop(0.3,withAlpha(color,1)); grad.addColorStop(1,withAlpha(color,1));
    ctx.fillStyle=grad; ctx.fillRect(x0,yTop,x1-x0,Math.ceil(bh));
  }
  ctx.restore();
}

/* ─── format helpers ────────────────────────────────────── */
function formatRadioQuote(text) {
  const n=(text||'...').trim().replace(/^\"+|\"+$/g,'');
  return `"${n.toUpperCase()}"`;
}

/* ─── global quote size helper (NO MINIMUM, ALLOW INFINITE SHRINK) ── */
function computeGlobalQuoteSize(messages, maxWidth, totalBlockH, totalMessages, sc) {
  const maxSize = 24 * sc;
  const gap = 4 * sc;
  const zoneH = (totalBlockH - (totalMessages - 1) * gap) / totalMessages;
  const usableH = zoneH - Math.round(2 * sc);
  for (let size = maxSize; size >= 1; size -= 1) {
    const lineHeight = size * 1.2;
    quoteMeasureCtx.font = `400 ${size}px Formula1 Regular, Arial`;
    let ok = true;
    for (const msg of messages) {
      const lines = getWrappedLines(quoteMeasureCtx, msg.quote, maxWidth);
      if (lines.length * lineHeight > usableH) { ok = false; break; }
    }
    if (ok) return { size: size, lineHeight, gap };
  }
  return { size: 1, lineHeight: 1.2, gap };
}

/* ─── draw the card ─────────────────────────────────────── */
function drawCardToCanvas(ctx, card) {
  const W = card.W, H = card.H, sc = W / 360;
  const divY = Math.round(H * DIVIDER_Y_RATIO);

  ctx.fillStyle = card.bg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(0, 0, W, H, 24 * sc);
  else ctx.rect(0, 0, W, H);
  ctx.fill();

  drawWave(ctx, W, H, waveFillColor(card.mainC, card.bg), generateBars(computeSeed(), 20));

  const nameY = Math.round(18 * sc);   // header text stays where it belongs
  ctx.textBaseline = 'top';
  const nameSz = fittedNameSize(ctx, card.driverName, 25 * sc, 'Formula1 Bold, Arial Black, Arial');

  // Logo — a genuine 2× size, right-aligned. The art sits centered inside its
  // box, and the box bottom is anchored just above the separator so the logo
  // never crosses the divider. If a centered art would clip the header text, it
  // is nudged down only as far as needed to clear it. Tiny banner logos whose
  // files carry huge transparent padding are cropped and enlarged to fill the
  // space, so they don't look smaller than the rest.
  const logoBottom = Math.round(H * DIVIDER_Y_RATIO) - Math.round(6 * sc);
  const logoMaxW = Math.round(W * 0.5);

  // Logo first — the header text is drawn over it, so it stays readable even
  // when the logo gets close.
  if (card.logoImage) {
    const iw = card.logoImage.naturalWidth || card.logoImage.width;
    const ih = card.logoImage.naturalHeight || card.logoImage.height;
    if (iw > 0 && ih > 0) {
      const art = logoArtBounds(card.logoImage);
      const srcW = art.right - art.left + 1;
      const srcH = art.bottom - art.top + 1;
      // Bottom of the RADIO label (name sits above it) — the logo must sit
      // BELOW this line so no series logo ever overlaps the header text.
      const radioBottom = nameY + nameSz * 1.05 + Math.round(4 * sc) + Math.round(26 * sc);
      const minTop = radioBottom + Math.round(2 * sc);
      const availH = Math.max(1, logoBottom - minTop);
      const ar = srcW / srcH;
      // Wide banner logos get the compact "banner" box; tall/square logos fit
      // the space between the header text and the divider.
      const bannerW = Math.round(120 * sc);
      const bannerH = Math.round(44 * sc);
      let dispW, dispH;
      if (ar > 1.5) {
        dispW = bannerW;
        dispH = Math.round(dispW / ar);
        if (dispH > bannerH) { dispH = bannerH; dispW = Math.round(dispH * ar); }
      } else {
        dispW = logoMaxW;
        dispH = Math.round(dispW / ar);
        if (dispH > availH) { dispH = availH; dispW = Math.round(dispH * ar); }
      }
      const dx = W - Math.round(22 * sc) - dispW;
      const dy = minTop + Math.round((availH - Math.min(dispH, availH)) / 2);
      ctx.drawImage(card.logoImage, art.left, art.top, srcW, srcH, dx, dy, dispW, dispH);
    }
  } else {
    ctx.fillStyle = card.nameC; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const len = card.label.length, fsb = len > 8 ? 8 : len > 5 ? 9 : len > 3 ? 11 : 16;
    ctx.font = `700 ${Math.round(fsb * sc)}px Formula1 Regular, Arial Black, Arial`;
    ctx.fillText(card.label, W - Math.round(22 * sc) - logoMaxW / 2, (Math.round(40 * sc) + logoBottom) / 2);
    ctx.textBaseline = 'alphabetic';
  }

  // header (on top of the logo)
  ctx.font = `900 ${Math.round(75.2 * sc)}px Octosquares, Arial Black, Arial`;
  ctx.fillStyle = card.numC; ctx.textAlign = 'left';
  ctx.fillText(card.carNum, Math.round(20 * sc), Math.round(14 * sc));
  ctx.textAlign = 'right';
  ctx.font = `700 ${nameSz}px Formula1 Bold, Arial Black, Arial`;
  ctx.fillStyle = card.nameC;
  ctx.fillText(card.driverName, W - Math.round(22 * sc), nameY);
  ctx.font = `700 ${Math.round(26 * sc)}px Formula1 Bold, Arial Black, Arial`;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('RADIO', W - Math.round(22 * sc), nameY + nameSz * 1.05 + Math.round(4 * sc));
  ctx.textBaseline = 'alphabetic';

  // Main divider
  ctx.fillStyle = hexToRgba(card.stripeC, 0.45);
  ctx.fillRect(0, divY, W, Math.max(1, Math.round(2 * sc)));

  // content area
  const qLeft = Math.round(20 * sc), qRight = Math.round(20 * sc);
  const maxWidth = W - qLeft - qRight;
  const contentH = H - divY;
  const totalMessages = card.messages.length;

  const senderHeight = Math.round(28 * sc);
  const messageBlockTop = divY + senderHeight;
  const messageBlockH = contentH - senderHeight;

  if (card.teamSender) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = `400 ${Math.round(11 * sc)}px Formula1 Regular, Arial`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(card.teamSender, qLeft, divY + Math.round(6 * sc));
    ctx.textBaseline = 'alphabetic';
  }

  const globalFit = computeGlobalQuoteSize(card.messages, maxWidth, messageBlockH, totalMessages, sc);
  const gap = globalFit.gap;
  const zoneH = (messageBlockH - (totalMessages - 1) * gap) / totalMessages;

  card.messages.forEach((msg, i) => {
    const zoneTop = messageBlockTop + i * (zoneH + gap);
    const isTeam = msg.type === 'team';
    ctx.textAlign = isTeam ? 'left' : 'right';
    ctx.fillStyle = isTeam ? '#ffffff' : card.accent;
    ctx.textBaseline = 'top';
    ctx.font = `400 ${globalFit.size}px Formula1 Regular, Arial`;
    const paddingTop = Math.round(2 * sc);
    wrapTextCanvas(ctx, msg.quote, isTeam ? qLeft : W - qRight, zoneTop + paddingTop, maxWidth, globalFit.lineHeight);
  });
}

/* ─── build card state (includes teamSender) ───────────── */
function buildCardState(W, logoImg) {
  const driverName = document.getElementById('driverName').value.toUpperCase() || 'DRIVER';
  const quote1 = formatRadioQuote(document.getElementById('quoteText').value || '...');

  const messages = [{
    type: msgType,
    quote: quote1,
    sender: (document.getElementById('senderName').value || 'ENGINEER').toUpperCase(),
  }];

  for (const reply of replies) {
    messages.push({
      type: reply.type,
      quote: formatRadioQuote(reply.quote || '...'),
      sender: (reply.sender || 'ENGINEER').toUpperCase(),
    });
  }

  const teamSender = messages.find(m => m.type === 'team')?.sender || null;

  return {
    W, H: W,
    bg: document.getElementById('bgColor').value,
    accent: document.getElementById('accentColor').value,
    mainC: document.getElementById('teamMainColor').value,
    nameC: document.getElementById('nameColor').value,
    numC: document.getElementById('numberColor').value,
    stripeC: document.getElementById('stripeColor').value,
    driverName,
    carNum: document.getElementById('carNumber').value || '',
    label: document.getElementById('teamLabel').value.toUpperCase() || '??',
    logoImage: logoImg,
    messages,
    teamSender,
  };
}

async function downloadCard() {

/* ─── roster-based data ─────────────────────────────────── */
function dbTeamRow(key) {
  if (!window.BTG || !BTG.DBCache || !BTG.DBCache.isReady()) return null;
  const teams = (BTG.DBCache.data() && BTG.DBCache.data().teams) || [];
  const k = String(key || '').trim().toLowerCase();
  for (let i = 0; i < teams.length; i++) {
    if (String(teams[i].team_key || '').toLowerCase() === k) return teams[i];
  }
  return null;
}

function buildTeamFromRoster(t) {
  const db = dbTeamRow(t.key);
  const main = (db && db.color_primary) || t.color1 || '#3b8de0';      // Color 1 → wave + background tint
  const secondary = (db && db.color_secondary) || t.color2 || main;    // Color 2 → divider stripe
  const bg = darkenHex(main, 0.16);
  const text = TEXT_OVERRIDES[t.key] || bestTextColor(main, secondary, bg);
  const dbLogo = db && db.logo ? 'logos/teams/' + db.logo : '';
  return {
    key: t.key,
    name: (db && db.team_name) || t.longName || t.name || t.key,
    short: t.name || t.key,
    series: t.series,
    main,
    bg,
    accent: text,      // name / number / message text (contrast-safe)
    name_c: text,
    num: text,
    stripe: secondary, // Color 2 → divider stripe
    label: ((db && db.team_name) || t.name || t.key).toUpperCase(),
    logo: dbLogo || TEAM_LOGO_MAP[t.key] || '',
  };
}

function seriesDisplayName(id) {
  const map = { 'GT1': 'XGT' };
  return map[id] || id;
}

function driverSeries(d) {
  if (d.series) return String(d.series);
  const team = d.team && BTG.Roster.teamByKey(d.team);
  if (team && team.series) return String(team.series);
  const t = String(d.team || '').toUpperCase();
  if (t.startsWith('XGT ') || t.startsWith('GT ')) return 'GT1';
  return '';
}

function dbSeriesFor(teamRow) {
  const s = String(teamRow && teamRow.series ? teamRow.series : '');
  return s === 'XGT' ? 'GT1' : s;
}

function discoverSeries() {
  const seen = new Set();
  (ALL_DB_DRIVERS || []).forEach(d => { if (d.series) seen.add(d.series); });
  (BTG.Roster.teams || []).forEach(t => { if (t.series) seen.add(String(t.series)); });
  const known = { 'F1': 1, 'F2': 2 };
  SERIES_LIST = Array.from(seen).sort((a, b) => (known[a] || 99) - (known[b] || 99) || a.localeCompare(b)).map(id => ({ id, name: seriesDisplayName(id) }));
}

function teamOrderFor(series) {
  if (BTG.Roster.teamOrderFor) return BTG.Roster.teamOrderFor(series) || [];
  if (BTG.Roster.teamsFor) return (BTG.Roster.teamsFor(series) || []).map(t => t.key);
  return (BTG.Roster.teams || []).filter(t => t.series === series).map(t => t.key);
}

function loadTeamsFromRoster() {
  TEAMS_BY_SERIES = {};
  SERIES_LIST.forEach(s => {
    const order = teamOrderFor(s.id);
    let teams = order.map(k => { const t = BTG.Roster.teamByKey(k); return t ? buildTeamFromRoster(t) : null; }).filter(Boolean);
    const seen = new Set(teams.map(t => t.key));
    (DRIVERS_BY_SERIES[s.id] || []).forEach(d => {
      if (!d.teamKey || seen.has(d.teamKey)) return;
      seen.add(d.teamKey);
      const syn = { key: d.teamKey, name: (d.teamKey || '').replace(/^XGT /, ''), series: s.id, color1: '#555555', color2: '#333333' };
      teams.push(buildTeamFromRoster(syn));
    });
    TEAMS_BY_SERIES[s.id] = teams;
  });
}

function normNameKey(name) {
  const parts = String(name || '').toLowerCase().split(/\s+/).filter(Boolean);
  return parts.length <= 2 ? parts.join(' ') : parts[0] + ' ' + parts[parts.length - 1];
}

function loadDriversFromRoster() {
  const norm = d => ({ id: d.id || d.name, name: d.name, number: d.number || '', teamKey: d.team, series: driverSeries(d) });
  const list = (BTG.Roster.drivers || []).map(norm);
  const byKey = {};
  list.forEach(d => { if (d.name) byKey[normNameKey(d.name)] = true; });

  // Add DB-cache drivers missing from the roster (e.g. admin-created/moved XGT
  // second seats are never written back to the roster CSV).
  if (window.BTG && BTG.DBCache && BTG.DBCache.isReady()) {
    const data = BTG.DBCache.data();
    const teams = data.teams || [];
    const teamById = {};
    teams.forEach(t => { teamById[String(t.team_id)] = t; });
    (data.drivers || []).forEach(dd => {
      const name = String(dd.full_name || dd.driver_name || dd.name || '').trim();
      if (!name || byKey[normNameKey(name)]) return;
      const t = teamById[String(dd.team_id)];
      const teamKey = t ? String(t.team_key || t.team_name || '') : '';
      if (!teamKey) return;
      list.push({
        id: dd.driver_id != null ? dd.driver_id : name.toLowerCase().replace(/\s+/g, '-'),
        name: name,
        number: dd.driver_number != null ? String(dd.driver_number) : '',
        teamKey: teamKey,
        series: dbSeriesFor(t)
      });
      byKey[normNameKey(name)] = true;
    });
  }
  ALL_DB_DRIVERS = list;
}

function groupDriversBySeries() {
  DRIVERS_BY_SERIES = {};
  SERIES_LIST.forEach(s => {
    const order = teamOrderFor(s.id);
    const orderIdx = {};
    order.forEach((k, i) => orderIdx[k] = i);
    DRIVERS_BY_SERIES[s.id] = ALL_DB_DRIVERS
      .filter(d => d.series === s.id)
      .sort((a, b) => {
        const ia = orderIdx[a.teamKey] != null ? orderIdx[a.teamKey] : 99;
        const ib = orderIdx[b.teamKey] != null ? orderIdx[b.teamKey] : 99;
        return ia - ib || a.name.localeCompare(b.name);
      });
  });
}

function selectTeam(team) {

function applyDriverSelection(driver, btnEl) {

function buildDriverGrid() {
  const el = document.getElementById('drivers'); if (!el) return;
  el.innerHTML = '';
  if (!activeTeamKey) { el.innerHTML = '<div class="rc-no-drivers">Select a team to view drivers.</div>'; return; }

  const curName = document.getElementById('driverName').value.trim().toUpperCase();

function addReply() {

function removeReply(index) {

function updateReplyFromDOM(index) {

function syncAllRepliesFromDOM() {

function buildReplySections() {

    header.className = 'rc-reply-section-header';
    const title = document.createElement('div');
    title.className = 'rc-section-title';
    title.textContent = `Reply ${index + 1}`;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'rc-remove-reply-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = () => { syncAllRepliesFromDOM(); removeReply(index); };
    header.appendChild(title);
    header.appendChild(removeBtn);
    section.appendChild(header);

    const toggleWrap = document.createElement('div');
    toggleWrap.className = 'rc-msg-toggle';
    const btnDriver = document.createElement('button');
    btnDriver.className = 'rc-toggle-btn' + (reply.type === 'driver' ? ' active' : '');
    btnDriver.textContent = 'Driver Radio';
    btnDriver.onclick = () => { syncAllRepliesFromDOM(); setReplyType(index, 'driver'); };
    const btnTeam = document.createElement('button');
    btnTeam.className = 'rc-toggle-btn' + (reply.type === 'team' ? ' active' : '');
    btnTeam.textContent = 'Team Message';
    btnTeam.onclick = () => { syncAllRepliesFromDOM(); setReplyType(index, 'team'); };
    toggleWrap.appendChild(btnDriver);
    toggleWrap.appendChild(btnTeam);
    section.appendChild(toggleWrap);

    const quoteField = document.createElement('div');
    quoteField.className = 'rc-field';
    quoteField.style.marginTop = '8px';
    const quoteTextarea = document.createElement('textarea');
    quoteTextarea.className = 'rc-reply-quote';
    quoteTextarea.value = reply.quote;
    quoteTextarea.addEventListener('input', () => { updateReplyFromDOM(index); render(); });
    quoteField.appendChild(quoteTextarea);
    section.appendChild(quoteField);

    if (reply.type === 'team') {
      const senderField = document.createElement('div');
      senderField.className = 'rc-field';
      const senderLabel = document.createElement('label');
      senderLabel.textContent = 'Sender';
      const senderInput = document.createElement('input');
      senderInput.className = 'rc-reply-sender';
      senderInput.value = reply.sender;
      senderInput.addEventListener('input', () => { updateReplyFromDOM(index); render(); });
      senderField.appendChild(senderLabel);
      senderField.appendChild(senderInput);
      section.appendChild(senderField);
    }

    container.appendChild(section);
  });
}

/* ─── event listeners ───────────────────────────────────── */
document.getElementById('quoteText').addEventListener('input', render);
document.getElementById('senderName').addEventListener('input', render);
document.getElementById('driverOverrideSelect').addEventListener('change', e => applyDriverOverride(e.target.value));

/* ─── init ──────────────────────────────────────────────── */
async function initRadioTool() {
  try {
    if (!window.BTG || !BTG.Roster) throw new Error('roster missing');
    await BTG.Roster.load();
    if (window.BTG && BTG.DBCache) { try { await BTG.DBCache.init(); } catch (_) {} }
    loadDriversFromRoster();
    discoverSeries();
    groupDriversBySeries();
    loadTeamsFromRoster();
    preloadTeamLogos();
    buildDriverOverrideSelect();
    setSeries(SERIES_LIST.length ? SERIES_LIST[0].id : '');
    buildReplySections();
  } catch (_) {
    TEAMS_BY_SERIES = {}; DRIVERS_BY_SERIES = {}; SERIES_LIST = []; ALL_DB_DRIVERS = [];
    buildSeriesTabs(); buildDriverGrid(); buildReplySections(); render();
  }
}
initRadioTool();
</script>
