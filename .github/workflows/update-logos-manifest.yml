name: Update Team Logo Manifest

on:
  push:
    paths:
      - 'logos/**'
  schedule:
    # Daily at 03:45 UTC (just after the DB cache update)
    - cron: '45 3 * * *'
  workflow_dispatch:

jobs:
  build-logos-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build logos manifest
        env:
          # Repo layout: scripts/ and logos/ are both at the repo root.
          BTG_SITE_ROOT: ${{ github.workspace }}
        run: node scripts/build-logos-manifest.js

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "logos/logos-manifest.json"
          git diff --cached --quiet || git commit -m "chore: update team logo manifest"
          git push
