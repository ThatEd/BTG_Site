# ═══════════════════════════════════════════════════════════════════════════
#  Deploy the site to GitHub Pages.
#
#  Repo layout: the repository root IS the Site DB folder, so uploading the
#  repo root (path: .) publishes index.html / drivers.html / ... at the top
#  level of the Pages site.
# ═══════════════════════════════════════════════════════════════════════════
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update DB Public Cache (daily)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (repo root = Site DB)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
