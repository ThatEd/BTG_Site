name: Update DB Public Cache (daily)

on:
  schedule:
    # Daily at 03:15 UTC
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  build-db-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build DB public cache
        run: node BTG Backend/scripts/build-db-cache.js

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Site DB/cache/public-data.json"
          git diff --cached --quiet || git commit -m "chore: daily DB public-data cache"
          git push
