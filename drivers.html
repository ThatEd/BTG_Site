<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Drivers</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<style>
/* ── TFG base tokens ─────────────────────────────────────────────────────── */
:root {
  --bg-base: #18181b;
  --bg-card: #0e0e12;
  --bg-card-hover: #131318;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.14);
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --text-disabled: #52525b;
  --accent: #dc2626;
  --accent-light: #f87171;
  --accent-bg: rgba(220,38,38,0.08);
  --accent-border: rgba(220,38,38,0.25);
  --font-mono: ui-monospace, Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono',
    'Roboto Mono', 'Oxygen Mono', 'Ubuntu Monospace', 'Source Code Pro',
    'Fira Mono', 'Droid Sans Mono', 'Courier New', monospace;
  --team-rgb: 220, 38, 38;
}

@font-face {
  font-family: 'Formula1';
  src: url('fonts/AlfaqixDiode-SemiBold.otf') format('opentype');
  font-weight: 600;
  font-display: swap;
}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
/* Viewport-pinned glows so they never cut off / repeat on long pages */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at top left, rgba(220, 38, 38, 0.12), transparent 32%),
    radial-gradient(circle at 85% 12%, rgba(239, 68, 68, 0.1), transparent 28%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.01), transparent 20%);
}

/* ── TFG Layout ──────────────────────────────────────────────────────────── */
.dp-layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 120px); max-width: 1400px; margin: 0 auto; transition: grid-template-columns 0.25s ease; }
.dp-layout.sb-collapsed { grid-template-columns: 0 1fr; }
.dp-layout.sb-collapsed .dp-picker { border-right: 0; }
.dp-picker { background: rgba(0,0,0,0.25); border-right: 1px solid var(--border-subtle); padding: 10px 0; overflow-y: auto; max-height: calc(100vh - 120px); position: sticky; top: 56px; min-width: 0; }
.dp-picker__title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-disabled); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dp-picker__toggle { border: 1px solid var(--border-subtle); background: transparent; color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4; flex: none; }
.dp-picker__toggle:hover { color: var(--text-primary); border-color: var(--border-medium); }
.dp-picker__group { padding: 4px 0; }
.dp-picker__team { display: flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.dp-picker__chip { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 14px; border: none; border-left: 3px solid transparent; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12px; text-align: left; transition: all 100ms; }
.dp-picker__chip:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
.dp-picker__chip--active { background: rgba(255,255,255,0.05) !important; color: var(--text-primary) !important; font-weight: 600; border-left-color: rgb(var(--team-rgb)); }
.dp-picker__flag { height: 14px; border: 1px solid rgba(255,255,255,0.15); }
.dp-picker__name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-picker__num { font-size: 10px; color: var(--text-disabled); font-family: var(--font-mono); }
/* Floating toggle — always visible, toggles the sidebar open/closed (same inline styling, slides in/out) */
.dp-sidebar-toggle { position: fixed; left: 8px; bottom: 12px; z-index: 65; border: 1px solid var(--border-subtle); background: #161618; color: var(--text-muted); font-size: 10px; font-family: var(--font-mono); padding: 5px 9px; border-radius: 4px; cursor: pointer; }
.dp-sidebar-toggle:hover { color: var(--text-primary); }

/* ── TFG Cards (glow via --team-rgb) ─────────────────────────────────────── */
.dp-main { display: grid; grid-template-columns: 1fr 1.1fr 0.9fr; gap: 12px; padding: 12px; overflow-y: auto; }
@media (max-width: 1100px) { .dp-main { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .dp-main { grid-template-columns: 1fr; } }
.dp-left, .dp-center, .dp-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.dp-card, .dash-overview__col {
  border: 1px solid rgb(var(--team-rgb, 99 102 241) / 0.35);
  border-radius: 6px;
  background: #161618;
  box-shadow: 0 0 8px rgb(var(--team-rgb, 99 102 241) / 0.08);
  position: relative;
  overflow: visible;
  transition: border-color 0.2s, box-shadow 0.2s;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.dp-card::after, .dash-overview__col::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 10px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
  box-shadow:
    0 0 8px 2px rgb(var(--team-rgb, 99 102 241) / 0.25),
    0 0 18px 5px rgb(var(--team-rgb, 99 102 241) / 0.1);
  mask-image:
    conic-gradient(
      from var(--cursor-angle, 45deg) at center,
      black 0deg, transparent 60deg, transparent 300deg, black 360deg
    );
}
.dp-card:hover, .dash-overview__col:hover {
  border-color: rgb(var(--team-rgb, 99 102 241) / 0.55);
  box-shadow: 0 0 14px rgb(var(--team-rgb, 99 102 241) / 0.14);
}
.dp-card__title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 10px; }
.dp-card__subtitle { font-size: 10px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

/* ── Hero ────────────────────────────────────────────────────────────────── */
.dp-hero { display: flex; align-items: flex-start; gap: 12px; position: relative; }
.dp-hero__photo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--border-medium); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; background: rgba(0,0,0,0.3); }
.dp-hero__img { width: 100%; height: 100%; object-fit: cover; }
.dp-hero__placeholder { font-size: 24px; color: var(--text-muted); }
.dp-hero__info { flex: 1; min-width: 0; }
.dp-hero__name { display: flex; flex-direction: column; }
.dp-hero__first { font-size: 11px; color: var(--text-secondary); }
.dp-hero__last { font-size: 18px; font-weight: 800; text-transform: uppercase; color: var(--text-primary); letter-spacing: -0.02em; font-family: 'Formula1', sans-serif; }
.dp-hero__meta { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.dp-hero__flag { height: 12px; border: 1px solid var(--border-medium); }
.dp-hero__sep { color: var(--text-disabled); }
.dp-hero__team { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-top: 4px; }
.dp-hero__team-dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.dp-hero__number { position: absolute; top: 4px; right: 8px; font-size: 36px; font-weight: 900; color: rgba(255,255,255,0.04); font-family: 'Formula1', sans-serif; }

/* ── Contract ────────────────────────────────────────────────────────────── */
.dp-contract { display: flex; flex-direction: column; gap: 8px; }
.dp-contract__row { display: flex; justify-content: space-between; align-items: center; }
.dp-contract__label { font-size: 11px; color: var(--text-muted); }
.dp-contract__val { font-size: 13px; font-weight: 700; color: var(--text-secondary); }

/* ── Season Position ─────────────────────────────────────────────────────── */
.dp-pos { display: flex; align-items: baseline; gap: 12px; }
.dp-pos__rank { font-size: 28px; font-weight: 900; color: var(--text-primary); font-family: 'Formula1', sans-serif; }
.dp-pos__pts { font-size: 13px; color: var(--text-secondary); font-weight: 600; }

/* ── Last Season ─────────────────────────────────────────────────────────── */
.dp-prev { display: flex; flex-direction: column; gap: 6px; }
.dp-prev__row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--border-subtle); }
.dp-prev__row span:first-child { color: var(--text-secondary); }
.dp-prev__row span:last-child { font-weight: 600; color: var(--text-primary); }

/* ── Favorite Track ──────────────────────────────────────────────────────── */
.dp-fav-track { display: flex; align-items: center; gap: 8px; }
.dp-fav-track__flag { width: 24px; height: 16px; border: 1px solid var(--border-medium); }
.dp-fav-track__name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.dp-fav-track__note { font-size: 9px; color: var(--text-muted); }

/* ── Season Performance ──────────────────────────────────────────────────── */
.dp-grade__overall { font-size: 48px; font-weight: 900; text-align: center; padding: 4px 0; margin-bottom: 12px; letter-spacing: -0.02em; font-family: 'Formula1', sans-serif; }
.dp-grade__bars { display: flex; flex-direction: column; gap: 5px; }
.dp-grade__row { display: flex; align-items: center; gap: 8px; }
.dp-grade__label { font-size: 9px; color: var(--text-muted); width: 80px; text-align: right; flex-shrink: 0; }
.dp-grade__bar { flex: 1; height: 6px; background: var(--border-subtle); }
.dp-grade__fill { height: 100%; transition: width 300ms; }
.dp-grade__val { font-size: 10px; font-weight: 700; color: var(--text-secondary); width: 24px; text-align: center; }

/* ── Letter grade colors ─────────────────────────────────────────────────── */
.gr { font-weight: 600; }
.gr-s { color: #f59e0b; } .gr-a { color: #34d399; } .gr-b { color: #a1a1aa; }
.gr-c { color: #71717a; } .gr-d { color: #ef4444; } .gr-e { color: #dc2626; } .gr-f { color: #991b1b; }

/* ── Season Race Positions ───────────────────────────────────────────────── */
.dp-sparkline { display: flex; gap: 2px; overflow-x: auto; padding-bottom: 4px; }
.dp-sparkline__race { display: flex; flex-direction: column; align-items: center; min-width: 24px; }
.dp-sparkline__track { position: relative; width: 20px; height: 90px; }
.dp-sparkline__line { position: absolute; left: 50%; transform: translateX(-50%); width: 2px; opacity: 0.6; }
.dp-sparkline__dot { position: absolute; left: 50%; transform: translate(-50%,-50%); width: 5px; height: 5px; border-radius: 50%; }
.dp-sparkline__label { font-size: 7px; color: var(--text-disabled); margin-top: 2px; }

/* ── Stats Grid ──────────────────────────────────────────────────────────── */
.dp-stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.dp-stat { text-align: center; padding: 6px 4px; background: var(--border-subtle); border: 1px solid var(--border-subtle); }
.dp-stat__val { font-size: 16px; font-weight: 800; color: var(--text-primary); }
.dp-stat__lbl { font-size: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

/* ── Verdict ─────────────────────────────────────────────────────────────── */
.dp-verdict__label { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.dp-verdict__stats { display: flex; gap: 10px; margin-bottom: 10px; }
.dp-verdict__stat { text-align: center; }
.dp-verdict__val { display: block; font-size: 18px; font-weight: 800; color: var(--accent-light); }
.dp-verdict__lbl { font-size: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.dp-verdict__bullets { margin: 0; padding: 0 0 0 16px; font-size: 11px; color: var(--text-secondary); line-height: 1.6; }

/* ── Career Race Record ──────────────────────────────────────────────────── */
.dp-career-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }

/* ── Past Seasons ────────────────────────────────────────────────────────── */
.dp-past-head { display: grid; grid-template-columns: 34px 42px minmax(0,1fr) repeat(4, 34px) 44px; gap: 6px; align-items: center; padding: 6px 16px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-disabled); border-bottom: 1px solid var(--border-subtle); }
.dp-past-head .tm { min-width: 0; }
.dp-past-head .px { text-align: right; }
.dp-past-head .ps { text-align: right; }
.dp-past-row { display: grid; grid-template-columns: 34px 42px minmax(0,1fr) repeat(4, 34px) 44px; gap: 6px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 12px; min-width: 0; }
.dp-past-row:last-child { border-bottom: none; }
.dp-past-row .yr { font-family: var(--font-mono); color: var(--text-muted); }
.dp-past-row .tm { font-weight: 600; min-width: 0; display: flex; align-items: center; gap: 7px; overflow: hidden; }
.dp-past-row .tm > span:not(.sx) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-past-row .tm .team-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.dp-past-row .st { font-family: var(--font-mono); color: var(--text-secondary); font-size: 10px; }
.dp-past-row .sx { font-family: var(--font-mono); font-size: 9px; color: var(--text-disabled); text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--border-subtle); border-radius: 3px; padding: 1px 5px; flex: none; }
.dp-hero__academy { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); margin-top: 5px; }
.dp-hero__academy .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-disabled); flex: none; }
.dp-picker__acad { font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-disabled); border: 1px solid var(--border-subtle); border-radius: 3px; padding: 1px 4px; margin-left: 6px; flex: none; }
.dp-past-row .px { font-family: var(--font-mono); color: var(--text-secondary); font-size: 11px; text-align: right; }
.dp-past-row .ps { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); text-align: right; }
@media (max-width: 560px) {
  .dp-past-head, .dp-past-row { grid-template-columns: 30px 34px minmax(0,1fr) repeat(2, 30px) 40px; }
  .dp-past-head .px:nth-of-type(5), .dp-past-head .px:nth-of-type(6),
  .dp-past-row .px:nth-of-type(5), .dp-past-row .px:nth-of-type(6) { display: none; }
}

/* ── Grid Penalties ──────────────────────────────────────────────────────── */
.dp-penalty { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 11px; color: var(--text-secondary); background: var(--border-subtle); margin-bottom: 2px; }

/* ── Career Timeline ─────────────────────────────────────────────────────── */
.dp-timeline { position: relative; padding: 26px 0 8px; }
.dp-timeline-track { position: relative; height: 42px; background: var(--border-subtle); overflow: hidden; }
.dp-timeline-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.dp-timeline-seg-label { font-size: 9px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7); letter-spacing: 0.05em; font-family: var(--font-mono); }
.dp-timeline-years { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-mono); }

/* ── Controls bar ────────────────────────────────────────────────────────── */
.dp-controls { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border-subtle); flex-wrap: wrap; margin-bottom: 12px; }
.dp-controls .label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.dp-controls select { background: #3a3a3a; border: 1px solid #4d4d4d; color: #ffffff; font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
.dp-controls select option { background: #3a3a3a; color: #ffffff; }
.dp-series-logo { width: 64px; height: auto; display: block; flex-shrink: 0; }
.dp-spacer { flex: 1; }

/* ── Series selector glow (TFG-style) ─────────────────────────────────────── */
.series-tab { transition: color .15s, box-shadow .15s, border-color .15s; }
.series-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--series-color, var(--accent));
  box-shadow:
    0 0 10px color-mix(in srgb, var(--series-color, var(--accent)) 40%, transparent),
    inset 0 0 6px color-mix(in srgb, var(--series-color, var(--accent)) 20%, transparent);
}

/* ── TFG Timeline ────────────────────────────────────────────────────────── */
.dp-tl { background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 14px 20px; }
.dp-tl__years { display: flex; align-items: center; gap: 0; margin-bottom: 4px; }
.dp-tl__years span { flex: 1; text-align: center; font-size: 9px; color: var(--text-disabled); font-weight: 600; }
.dp-tl__track { display: flex; align-items: stretch; gap: 0; }
.dp-tl__cell {
  flex: 1; height: 30px; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.dp-tl__cell img { max-height: 12px; width: auto; z-index: 1; opacity: 0.9; }
.dp-tl__mark {
  position: absolute; left: 50%; top: -8px; transform: translateX(-50%);
  font-size: 8px; color: #fbbf24; font-weight: 700;
  text-shadow: 0 0 3px rgba(0,0,0,0.8); z-index: 2;
}
.dp-tl__legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 10px; color: var(--text-muted); }
.dp-tl__legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }

/* ── Attribution ─────────────────────────────────────────────────────────── */
.tfg-attrib { position: fixed; bottom: 12px; right: 16px; font-size: 9px; color: var(--text-disabled); z-index: 60; font-family: var(--font-mono); }
.tfg-attrib a { color: var(--text-disabled); text-decoration: underline; }
.tfg-attrib a:hover { color: var(--text-muted); }

/* ── Empty state ─────────────────────────────────────────────────────────── */
.dp-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body data-page="drivers">

<nav class="btg-nav" id="btg-nav"></nav>

<div style="max-width:1400px;margin:0 auto;padding:0 16px;">

  <!-- Controls: series tabs + season selector -->
  <div class="dp-controls">
    <div class="series-bar" id="series-bar" style="border:none;background:none;padding:0;"></div>
    <span class="dp-spacer"></span>
    <span class="label">Season</span>
    <select id="season-select"></select>
  </div>

  <!-- Sidebar + Detail -->
  <div class="dp-layout" id="dp-layout">
    <div class="dp-picker" id="sidebar">
      <div class="dp-picker__title" id="sb-head">
        <span>Drivers</span>
        <button class="dp-picker__toggle" id="sb-collapse" title="Hide sidebar" type="button">‹</button>
      </div>
      <div id="sb-list"></div>
    </div>
    <div id="detail-panel" class="dp-empty">Select a driver from the list.</div>
  </div>
  <button class="dp-sidebar-toggle" id="sb-toggle" type="button">☰ Drivers</button>
</div>

<div class="tfg-attrib">UI by <a href="https://www.patreon.com/c/TFGTools" target="_blank" rel="noopener">TFGTools</a></div>

<script src="js/common.js"></script>
<script src="js/border-glow.js"></script>
<script src="teams/f1.js"></script>
<script src="js/roster.js"></script>
<script src="js/db-cache.js"></script>
<script src="js/data-loader.js"></script>
<script>
(function() {
  var drivers = [], activeSeries = null, seriesList = [];
  var seasons = [], activeSeason = null;
  var selectedDriverId = null;

  // Team colour source of truth = the DB public cache (same as teams.html).
  // Falls back to the legacy hardcoded F1/F2 list only when the DB cache
  // hasn't loaded or has no entry for the team.
  function dbTeamRgb(name, secondary) {
    var v = BTG.DBCache && BTG.DBCache.teamColorRgb ? BTG.DBCache.teamColorRgb(name, secondary) : '';
    if (v) return v;
    var t = BTG.teamByName(name);
    return t ? (secondary ? (t.colorSecondary || '') : (t.color || '')) : '';
  }

  // Prefer the DB public cache (built daily from Supabase): if it loads,
  // swap the driver-data source to DB-backed methods so the page runs purely
  // off DB data (race results, standings, driver names/teams). Otherwise fall
  // back to the legacy static data-loader.
  BTG.DBCache.init().then(function(dbData) {
    if (dbData && dbData.races && dbData.races.length) {
      BTG.Data.getSeriesList = BTG.DBCache.getSeriesList;
      BTG.Data.getSeasons = BTG.DBCache.getSeasons;
      BTG.Data.buildDriverList = BTG.DBCache.buildDriverList;
    }
    // Load from cache (fast) — init() resolves immediately and auto-discovery
    // runs in the background, re-triggering load() via onUpdate when it lands.
    BTG.Data.init().then(load).catch(function() {
      drivers = [];
      seriesList = ['F1']; activeSeries = 'F1';
      seasons = [2026]; activeSeason = 2026;
      build();
    });
    BTG.Data.onUpdate(load);
  });

  function load() {
    // Build series list from discovered data, preserving selection if possible
    seriesList = BTG.Data.getSeriesList().map(function(s){return s.id;});
    if (seriesList.indexOf(activeSeries) === -1) activeSeries = seriesList[0] || 'F1';
    seasons = BTG.Data.getSeasons(activeSeries);
    if (seasons.indexOf(activeSeason) === -1) activeSeason = seasons[0] || 2026;
    drivers = BTG.Data.buildDriverList(activeSeries, activeSeason, { includeAll: true });
    build();
  }

  function build() {
    var bar = document.getElementById('series-bar');
    bar.innerHTML = ''; // clear so re-renders (onUpdate) don't duplicate tabs
    seriesList.forEach(function(s) {
      var t = document.createElement('div');
      t.className = 'series-tab' + (s === activeSeries ? ' active' : '');
      // Accent color derived from the series data — never hardcoded per series name.
      t.style.setProperty('--series-color', BTG.seriesAccent(s));
      t.setAttribute('data-series', s);
      // Clickable series logo (auto-discovered from logos/{series}.png, clamped)
      t.innerHTML = BTG.seriesLogoImg(s, 26);
      t.title = s;
      t.onclick = function() {
        activeSeries = s;
        seasons = BTG.Data.getSeasons(s);
        activeSeason = seasons[0] || 2026;
        rebuildSeasonSelect();
        drivers = BTG.Data.buildDriverList(s, activeSeason, { includeAll: true });
        selectedDriverId = null;
        renderSidebar();
        document.getElementById('detail-panel').className = 'dp-empty';
        document.getElementById('detail-panel').innerHTML = 'Select a driver from the list.';
        bar.querySelectorAll('.series-tab').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-series')===s);});
      };
      bar.appendChild(t);
    });

    rebuildSeasonSelect();
    renderSidebar();
  }

  function rebuildSeasonSelect() {
    var sel = document.getElementById('season-select');
    sel.innerHTML = '';
    seasons.forEach(function(s) { var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
    sel.value = activeSeason;
    sel.onchange = function() {
      activeSeason = Number(this.value);
      drivers = BTG.Data.buildDriverList(activeSeries, activeSeason, { includeAll: true });
      selectedDriverId = null;
      renderSidebar();
      document.getElementById('detail-panel').className = 'dp-empty';
      document.getElementById('detail-panel').innerHTML = 'Select a driver from the list.';
    };
  }

  function getSeriesDrivers() {
    return (BTG.groupBySeries(drivers)[activeSeries] || [])
      .sort(function(a,b) {
        var ta = a.teamOrder != null ? a.teamOrder : 99, tb = b.teamOrder != null ? b.teamOrder : 99;
        if (ta !== tb) return ta - tb;
        return (b.ovr||0)-(a.ovr||0) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0);
      });
  }

  // Full team name for the sidebar (from TeamNameLong.csv via the roster);
  // falls back to the short name when no long form exists.
  function teamDisplayName(teamName) {
    if (teamName && window.BTG && BTG.Roster && BTG.Roster.teamName) {
      return BTG.Roster.teamName(teamName, true) || teamName;
    }
    return teamName;
  }

  function renderSidebar() {
    var list = getSeriesDrivers();
    var sb = document.getElementById('sb-list');
    document.getElementById('sb-head').textContent = activeSeries + ' — ' + activeSeason;
    if (!list.length) { sb.innerHTML = '<div class="dp-empty">No drivers.</div>'; return; }

    // Group by team; teamless drivers group by their car (XGT/GT entries)
    var byTeam = {};
    var byCar = {};
    var privateers = [];
    list.forEach(function(d) {
      if (d.team) { if (!byTeam[d.team]) byTeam[d.team] = []; byTeam[d.team].push(d); }
      else if (d.car) { if (!byCar[d.car]) byCar[d.car] = []; byCar[d.car].push(d); }
      else { privateers.push(d); }
    });

    var html = '';
    Object.keys(byTeam).forEach(function(teamName) {
      var color = dbTeamRgb(teamName) || '185,29,46';
      html += '<div class="dp-picker__group"><div class="dp-picker__team">'
        + BTG.teamLogoImg(teamName, activeSeries, 12)
        + BTG.esc(teamDisplayName(teamName))
        + '</div>';
      var color2 = dbTeamRgb(teamName, true);
      byTeam[teamName].forEach(function(d) {
        var num = d.standings ? d.standings.pos : '—';
        html += '<button class="dp-picker__chip' + (d.id===selectedDriverId?' dp-picker__chip--active':'') + '" data-id="'+BTG.esc(d.id)+'" data-color="'+BTG.esc(color)+'" data-color2="'+BTG.esc(color2)+'">'
          + '<span class="dp-picker__num">'+num+'</span>'
          + BTG.flagImg(d.nation, 14, 11)
          + '<span class="dp-picker__name">'+BTG.esc(d.fullName || d.name)+'</span>'
          + (d.academy ? '<span class="dp-picker__acad"'+(d.academyColor ? ' style="color:'+BTG.esc(d.academyColor)+'"' : '')+'>'+BTG.teamLogoImg(d.academy, activeSeries, 9)+BTG.esc(d.academy)+'</span>' : '')
          + '</button>';
      });
      html += '</div>';
    });
    // Teamless drivers grouped by car (XGT/GT entries)
    Object.keys(byCar).forEach(function(carName) {
      html += '<div class="dp-picker__group"><div class="dp-picker__team">'
        + BTG.carLogoImg(carName, activeSeries, 12)
        + BTG.esc(carName)
        + '</div>';
      byCar[carName].forEach(function(d) {
        var num = d.standings ? d.standings.pos : '—';
        html += '<button class="dp-picker__chip' + (d.id===selectedDriverId?' dp-picker__chip--active':'') + '" data-id="'+BTG.esc(d.id)+'" data-color="185,29,46">'
          + '<span class="dp-picker__num">'+num+'</span>'
          + BTG.flagImg(d.nation, 14, 11)
          + '<span class="dp-picker__name">'+BTG.esc(d.fullName || d.name)+'</span>'
          + '</button>';
      });
      html += '</div>';
    });
    if (privateers.length) {
      html += '<div class="dp-picker__group"><div class="dp-picker__team">Privateers</div>';
      privateers.forEach(function(d) {
        var num = d.standings ? d.standings.pos : '—';
        html += '<button class="dp-picker__chip' + (d.id===selectedDriverId?' dp-picker__chip--active':'') + '" data-id="'+BTG.esc(d.id)+'" data-color="185,29,46">'
          + '<span class="dp-picker__num">'+num+'</span>'
          + BTG.flagImg(d.nation, 14, 11)
          + '<span class="dp-picker__name">'+BTG.esc(d.fullName || d.name)+'</span>'
          + '</button>';
      });
      html += '</div>';
    }
    sb.innerHTML = html;

    sb.querySelectorAll('.dp-picker__chip').forEach(function(el) {
      el.onclick = function() {
        sb.querySelectorAll('.dp-picker__chip').forEach(function(x){x.classList.remove('dp-picker__chip--active');});
        el.classList.add('dp-picker__chip--active');
        selectedDriverId = el.dataset.id;
        var color = el.dataset.color;
        var color2 = el.dataset.color2 || '';
        if (color) BTG.setTeamColors(color, color2);
        renderDetail(selectedDriverId);
      };
    });
  }

  function renderDetail(driverId) {
    var d = drivers.find(function(x){return x.id===driverId;});
    if (!d) return;
    var acadName = d.academy && window.BTG && BTG.Roster && BTG.Roster.teamName
      ? (BTG.Roster.teamName(d.academy) || d.academy) : d.academy;
    var color = dbTeamRgb(d.team) || '185,29,46';
    var panel = document.getElementById('detail-panel');
    panel.className = '';
    panel.innerHTML = '';
    // Team color for per-card glow (space-separated RGB, like TFG --team-rgb)
    var rgbSpaced = color.replace(/\s*,\s*/g, ' ');
    panel.style.setProperty('--team-rgb', rgbSpaced);

    var ss = d.seasonStats || {};
    // Season performance: five components averaged for the overall grade.
    var perf = computeSeasonPerformance(d, ss, drivers);
    var overallGrade = gradeOf(perf.overall);
    var nameParts = (d.fullName || d.name).split(' ');

    var html = '<div class="dp-main">';

    // ══ LEFT ══
    html += '<div class="dp-left">';

    // Hero — wrapped in BorderGlow exactly like TFG (per-card, isSelected)
    var heroInner = '<div class="dp-card dp-hero">'
      + '<div class="dp-hero__number">'+(d.standings?d.standings.pos:'')+'</div>'
      + '<div class="dp-hero__photo" style="border-color:rgb('+color+');box-shadow:0 0 24px rgb('+color+' / 0.2)">'
      + BTG.driverPhotoImg(d.fullName || d.name, 76)
      + '</div>'
      + '<div class="dp-hero__info">'
      + '<div class="dp-hero__name"><span class="dp-hero__first">'+(nameParts.slice(0,-1).join(' ')||'')+'</span><span class="dp-hero__last">'+(nameParts.slice(-1)[0]||'')+'</span></div>'
      + '<div class="dp-hero__meta">'+BTG.esc(d.nation||'')+(d.carNumber ? '<span class="dp-hero__sep">·</span>#'+BTG.esc(d.carNumber) : '')+'</div>'
      + '<div class="dp-hero__team" style="color:rgb('+color+')">'
      + BTG.entryLogoImg(d.team, d.car, d.series || activeSeries, 18)
      + '<span>'+BTG.esc(BTG.entryLabel(d.team, d.car))+'</span>'
      + '</div>'
      + (d.academy ? '<div class="dp-hero__academy"'+(d.academyColor ? ' style="color:'+BTG.esc(d.academyColor)+'"' : '')+'>'
          + BTG.teamLogoImg(d.academy, d.series || activeSeries, 12)
          + '<span>'+BTG.esc(acadName)+(d.academyRole === 'Reserve' ? ' Reserve' : ' Academy')+'</span></div>' : '')
      + '</div></div>';
    html += BTG.wrapCard(heroInner, {
      teamColor: color,
      backgroundColor: '#161618',
      borderRadius: 8,
      glowRadius: 12,
      glowIntensity: 0.45,
      isSelected: true
    });

    // Contract — tenure computed from history (scoped to the current series)
    var tenure = '—';
    var firstSeasonWithTeam = (d.history||[]).find(function(h){return h.series === d.series && h.team && h.team === d.team;});
    if (firstSeasonWithTeam) tenure = 'since ' + firstSeasonWithTeam.season;
    html += '<div class="dp-card"><div class="dp-card__title">Contract</div>'
      + '<div class="dp-contract">'
      + '<div class="dp-contract__row"><span class="dp-contract__label">Team Tenure</span><span class="dp-contract__val">'+tenure+'</span></div>'
      + '<div class="dp-contract__row"><span class="dp-contract__label">Contract Until</span><span class="dp-contract__val">—</span></div>'
      + '<div class="dp-contract__row"><span class="dp-contract__label">Status</span><span class="dp-contract__val">—</span></div>'
      + '</div></div>';

    // Season Position
    html += '<div class="dp-card"><div class="dp-card__title">Season Position</div>'
      + '<div class="dp-pos"><span class="dp-pos__rank">'+(d.standings?'P'+d.standings.pos:'—')+'</span><span class="dp-pos__pts">'+(d.standings?d.standings.pts+' pts':'—')+'</span></div></div>';

    // Last Season (scoped to the current series)
    var ls = (d.history||[]).find(function(h){return h.series === d.series && h.season===activeSeason-1;});
    html += '<div class="dp-card"><div class="dp-card__title">Last Season · '+(activeSeason-1)+'</div>'
      + '<div class="dp-prev">'
      + '<div class="dp-prev__row"><span>Position</span><span>'+(ls&&ls.pos&&ls.pos!=='—'?'P'+ls.pos:'—')+'</span></div>'
      + '<div class="dp-prev__row"><span>Points</span><span>'+(ls&&ls.points!=null?ls.points:'—')+'</span></div>'
      + '<div class="dp-prev__row"><span>Wins</span><span>'+(ls&&ls.wins?ls.wins:'—')+'</span></div>'
      + '<div class="dp-prev__row"><span>Podiums</span><span>'+(ls&&ls.podiums?ls.podiums:'—')+'</span></div>'
      + '<div class="dp-prev__row"><span>DNFs</span><span>'+(ls&&ls.dnfs?ls.dnfs:'—')+'</span></div>'
      + '<div class="dp-prev__row"><span>Avg Finish</span><span>'+(ls&&ls.avgFinish&&ls.avgFinish!=='—'?'P'+ls.avgFinish:'—')+'</span></div>'
      + '<div class="dp-prev__row"><span>Races</span><span>'+(ls&&ls.races?ls.races:'—')+'</span></div>'
      + '</div></div>';

    // Favorite Track — compute from results
    var fav = computeFavoriteTrack(d);
    html += '<div class="dp-card"><div class="dp-card__title">Favorite Track</div>'
      + '<div class="dp-fav-track">'
      + '<div><div class="dp-fav-track__name">'+(fav?fav.track:'—')+'</div><div class="dp-fav-track__note">'+(fav?(fav.bestCount>0?'Best: P'+fav.best+' · '+fav.bestCount+'x':'—'):'—')+'</div></div></div></div>';

    html += '</div>'; // left

    // ══ CENTER ══
    html += '<div class="dp-center">';

    // Season Performance — Pace (30% quali lap / 70% avg lap), Qualifying,
    // Racecraft, vs Teammate (20% quali / 20% avg lap / 60% race) and
    // Reliability. Car placement is derived from race data, not real car data.
    var perfBars = [
      {label:'Pace', val: perf.pace, color:'#f87171'},
      {label:'Qualifying', val: perf.qualifying, color:'#a78bfa'},
      {label:'Racecraft', val: perf.racecraft, color:'#34d399'},
      {label: perf.label, val: perf.teammate, color:'#f59e0b'},
      {label:'Reliability', val: perf.reliability, color:'#ef4444'}
    ];
    html += '<div class="dp-card"><div class="dp-card__title">Season Performance</div>'
      + '<div class="dp-grade__overall '+gradeCls(gradeOf(overallGrade))+'" style="color:'+gradeColor(overallGrade)+'">'+overallGrade+'</div>'
      + '<div class="dp-grade__bars">'
      + perfBars.map(function(p){ return gbar(p.label, p.val, p.color); }).join('')
      + '</div></div>';

    // Season Race Positions — sparkline
    var spark = buildSparkline(d);
    html += '<div class="dp-card"><div class="dp-card__title">Season Race Positions</div>'
      + '<div class="dp-sparkline" id="sparkline">'+spark+'</div></div>';

    // Season Stats
    html += '<div class="dp-card"><div class="dp-card__title">Season Stats</div>'
      + '<div class="dp-stats-grid">'
      + statCell(ss.races||'—','Races')+statCell(ss.avgFinish||'—','Avg Finish')+statCell(ss.wins||'—','Wins')+statCell(ss.avgGrid||'—','Avg Grid')
      + statCell(ss.podiums||'—','Podiums')+statCell(ss.poles||'—','Poles')+statCell(ss.dnfs||'—','DNFs')+statCell('—','Pole→Win')
      + '</div>'
      + '<div style="margin-top:10px"><div class="dp-card__subtitle">Sprint Races</div>'
      + '<div class="dp-stats-grid" style="grid-template-columns:repeat(4,1fr)">'
      + statCell(ss.sprints||'—','Sprints')+statCell(ss.sprintWins||'—','Wins')+statCell(ss.sprintPodiums||'—','Podiums')+statCell(ss.sprintPts||'—','Points')
      + '</div></div></div>';

    html += '</div>'; // center

    // ══ RIGHT ══
    html += '<div class="dp-right">';

    // Verdict
    var h2hScore = (perf.teammate != null) ? Math.round(perf.teammate) + '%' : '—';
    var teamPts = 0;
    for (var ti = 0; ti < drivers.length; ti++) {
      var td = drivers[ti];
      if (td.series === d.series && td.team === d.team && td.standings) {
        teamPts += Number(td.standings.pts) || 0;
      }
    }
    var myPts = d.standings ? (Number(d.standings.pts) || 0) : 0;
    var ptsShare = teamPts > 0 ? Math.round(myPts / teamPts * 100) + '%' : '—';
    html += '<div class="dp-card"><div class="dp-card__title">Verdict</div>'
      + '<div class="dp-verdict__label">'+(d.standings?seasonVerdict(d,ss):'—')+'</div>'
      + '<div class="dp-verdict__stats">'
      + '<div class="dp-verdict__stat"><span class="dp-verdict__val">'+h2hScore+'</span><span class="dp-verdict__lbl">H2H</span></div>'
      + '<div class="dp-verdict__stat"><span class="dp-verdict__val">'+ptsShare+'</span><span class="dp-verdict__lbl">Pts Share</span></div>'
      + '</div>'
      + '<div class="dp-verdict__bullets">—</div></div>';

    // Career Race Record
    var cr = d.careerRecord || {};
    html += '<div class="dp-card"><div class="dp-card__title">Career Race Record</div>'
      + '<div class="dp-career-grid">'
      + statCell(cr.starts||'—','Starts')+statCell(cr.wins||'—','Wins')+statCell(cr.podiums||'—','Podiums')+statCell(cr.points||'—','Points')
      + statCell(cr.dnfs||'—','DNFs')+statCell(cr.bestFinish||'—','Best Finish')+statCell(cr.avgFinish||'—','Avg Finish')+statCell(cr.yrs||'—','Yrs in '+BTG.esc(d.series||'Series'))
      + statCell(cr.yrsAtTeam||'—','Yrs at Team')
      + '</div></div>';

    // Past Seasons (full career across every series — same driver, not duplicated)
    if (d.history && d.history.length) {
      html += '<div class="dp-card"><div class="dp-card__title">Past Seasons</div>'
        + '<div class="dp-past-head"><span>Season</span><span>Series</span><span>Team</span><span class="px">Pos</span><span class="px">Wins</span><span class="px">Pods</span><span class="px">Pts</span><span class="ps">Rating</span></div>'
        + d.history.map(function(h) {
          var hcolor = dbTeamRgb(h.team) || '100,100,100';
          var label = h.team && h.team !== 'Privateer' ? h.team : (h.series || '');
          var logo = h.team && h.team !== 'Privateer' ? BTG.teamLogoImg(h.team, h.series, 14) : '';
          return '<div class="dp-past-row"><span class="yr">'+h.season+'</span>'
            + '<span class="st">'+BTG.esc(h.series || '—')+'</span>'
            + '<span class="tm">'+logo+BTG.esc(label)+(h.role === 'Reserve' ? '<span class="sx">Reserve</span>' : '')+'</span>'
            + '<span class="px">'+(h.pos && h.pos !== '—' ? 'P'+h.pos : '—')+'</span>'
            + '<span class="px">'+(h.wins ? h.wins : '—')+'</span>'
            + '<span class="px">'+(h.podiums ? h.podiums : '—')+'</span>'
            + '<span class="px">'+(h.points != null ? h.points : '—')+'</span>'
            + '<span class="ps"'+(h.grade ? ' style="color:'+gradeColor(h.grade)+'"' : '')+'>'+(h.grade||'—')+'</span></div>';
        }).join('') + '</div>';
    }

    // Grid Penalties
    html += '<div class="dp-card"><div class="dp-card__title">Grid Penalties</div><div style="color:var(--text-disabled);font-size:12px;padding:8px">No grid penalties</div></div>';

    html += '</div>'; // right
    html += '</div>'; // dp-main

    // Career Timeline (full width below) — TFG-style year blocks. The main track
    // only shows DRIVING stints (reserve/junior/academy never split a season in
    // two); junior + reserve contract drives are rendered as their own coloured
    // rows beneath, matching the save-viewer behaviour.
    var acadStints = d.academyStints || [];
    var resStints = d.reserveStints || [];
    var drivingHist = (d.history || []).filter(function (h) {
      return h.role !== 'Reserve' && h.role !== 'Junior' && h.role !== 'Affiliate';
    }).slice().sort(function(a,b){return a.season-b.season || (a.series<b.series?-1:a.series>b.series?1:0);});

    if (drivingHist.length || acadStints.length || resStints.length) {
      var hist = drivingHist;
      var blocks = [];      // consecutive same-team runs
      hist.forEach(function(h) {
        var last = blocks[blocks.length-1];
        if (last && last.team === h.team && last.series === h.series) {
          last.endYear = h.season;
        } else {
          blocks.push({ team: h.team, car: h.car, series: h.series, startYear: h.season, endYear: h.season });
        }
      });

      var teamBg = function(teamName) {
        var c = dbTeamRgb(teamName) || '100,100,100';
        return 'rgb(' + c + ')';
      };

      html += '<div class="dp-card" style="margin:0 12px"><div class="dp-card__title">Career Timeline</div>'
        + '<div class="dp-tl">';

      if (hist.length) {
        // Year label row (show series tag when a year spans multiple series)
        html += '<div class="dp-tl__years">' + hist.map(function(h){
            return '<span>' + h.season + (h.series && h.series !== d.series ? '·'+BTG.esc(h.series.slice(0,4)) : '') + '</span>';
          }).join('') + '</div>'
        + '<div class="dp-tl__track">';

        hist.forEach(function(h, yi) {
          var prev = yi > 0 ? hist[yi-1] : null;
          var team = h && h.team ? BTG.teamByName(h.team) : null;
          var bg = teamBg(h ? h.team : null);
          var showLogo = false;
          // Show logo only at mid-year of each run
          blocks.forEach(function(b) {
            var mid = Math.round((b.startYear + b.endYear) / 2);
            if (h.season === mid && b.series === h.series) showLogo = true;
          });
          // Brand-change ◆ when consecutive years differ in team
          var isBrandChange = prev && prev.team && h && h.team && prev.team !== h.team;
          var cellStyle = 'background:' + bg + ';opacity:0.75;';
          html += '<div class="dp-tl__cell" style="' + cellStyle + '">'
            + (showLogo && (team || h.car) ? BTG.entryLogoImg(h.team, h.car, h.series, 12) : '')
            + (isBrandChange ? '<span class="dp-tl__mark">◆</span>' : '')
            + '</div>';
        });
        html += '</div>';

        // Label row below (team name per run)
        html += '<div class="dp-tl__legend">';
        blocks.forEach(function(b) {
          var c = dbTeamRgb(b.team) ? 'rgb(' + dbTeamRgb(b.team) + ')' : '#71717a';
          var yrsLabel = b.startYear === b.endYear ? b.startYear : b.startYear + '-' + String(b.endYear).slice(2);
          html += '<span class="dp-tl__legend-item" style="display:inline-flex;align-items:center;gap:5px;">'
            + '<span class="dot" style="background:' + c + '"></span>'
            + BTG.entryLogoImg(b.team, b.car, b.series || activeSeries, 10)
            + BTG.esc(BTG.entryLabel(b.team, b.car)) + (b.series && b.series !== d.series ? ' <span style="opacity:.55">'+BTG.esc(b.series)+'</span>' : '') + ' <span style="opacity:.55">' + yrsLabel + '</span>'
            + '</span>';
        });
        html += '</div>';
      } else {
        html += '<div style="color:var(--text-disabled);font-size:11px;padding:4px 0 8px">No driving stints — career shown via academy/reserve below.</div>';
      }

      // Academy + Reserve rows (junior + reserve contract drives) — one coloured
      // block per stint, aligned to the same year axis, in the team's colour.
      var stintRows = acadStints.map(function(s){ return { type:'academy', team:s.team, color:s.color, seasons:s.seasons }; })
        .concat(resStints.map(function(s){ return { type:'reserve', team:s.team, color:s.color, seasons:s.seasons }; }));
      if (stintRows.length) {
        var colYears = {};
        hist.forEach(function(h){ colYears[h.season] = true; });
        stintRows.forEach(function(st){ st.seasons.forEach(function(s){ colYears[s] = true; }); });
        var gy = Object.keys(colYears).map(Number).sort(function(a,b){return a-b;});
        var colIdx = {}; gy.forEach(function(y,i){ colIdx[y] = i + 1; });

        html += '<div style="margin-top:8px">';
        stintRows.forEach(function(st) {
          var color = st.color || '#9ca3af';
          var minY = Math.min.apply(null, st.seasons), maxY = Math.max.apply(null, st.seasons);
          var c1 = colIdx[minY], c2 = colIdx[maxY] + 1;
          html += '<div style="display:grid;grid-template-columns:repeat('+gy.length+',1fr);gap:2px;margin-bottom:4px;">'
            + '<div style="grid-column:'+c1+' / '+c2+';height:20px;display:flex;align-items:center;justify-content:center;gap:4px;background:'+color+'22;border:1px solid '+color+'55;border-radius:3px;overflow:hidden;">'
            + BTG.teamLogoImg(st.team, activeSeries, 12)
            + '<span style="font-size:8px;font-weight:700;color:'+color+';text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;">'
            + (st.type === 'reserve' ? 'Reserve ' : 'Academy ')
            + (minY === maxY ? minY : minY + '-' + String(maxY).slice(2))
            + '</span></div></div>';
        });
        html += '</div>';
      }

      html += '</div></div>';
    }

    panel.innerHTML = html;

    // Enable cursor-tracking glow on any interactive glow cards
    BTG.initBorderGlow(panel);
    // TFG-style conic glow on every .dp-card (driven by --team-rgb + cursor)
    BTG.initCardGlow(panel);
  }

  function gradeOf(v) {
    if (v >= 98) return 'S+';
    if (v >= 95) return 'S';
    if (v >= 92) return 'S-';
    if (v >= 88) return 'A+';
    if (v >= 85) return 'A';
    if (v >= 82) return 'A-';
    if (v >= 78) return 'B+';
    if (v >= 75) return 'B';
    if (v >= 72) return 'B-';
    if (v >= 68) return 'C+';
    if (v >= 65) return 'C';
    if (v >= 62) return 'C-';
    if (v >= 58) return 'D+';
    if (v >= 55) return 'D';
    if (v >= 52) return 'D-';
    if (v >= 45) return 'E+';
    if (v >= 40) return 'E';
    return 'F';
  }
  function gradeCls(g){return 'gr gr-'+g[0].toLowerCase();}
  function gradeColor(g) {
    var c = String(g || '').charAt(0).toUpperCase();
    return { 'S':'#f59e0b', 'A':'#34d399', 'B':'#a1a1aa', 'C':'#71717a', 'D':'#ef4444', 'E':'#dc2626', 'F':'#991b1b' }[c] || '#71717a';
  }
  function gbar(label, val, color) {
    var g = gradeOf(val);
    return '<div class="dp-grade__row"><span class="dp-grade__label">'+label+'</span>'
      + '<div class="dp-grade__bar"><div class="dp-grade__fill" style="width:'+Math.max(0,Math.min(100,val))+'%;background:'+color+'"></div></div>'
      + '<span class="dp-grade__val '+gradeCls(g)+'" style="color:'+gradeColor(g)+'">'+g+'</span></div>';
  }
  function statCell(v, l) { return '<div class="dp-stat"><div class="dp-stat__val">'+v+'</div><div class="dp-stat__lbl">'+l+'</div></div>'; }

  function clamp100(v) { return Math.max(0, Math.min(100, Math.round(v))); }
  function posToScore(avgPos) {
    var p = parseFloat(avgPos);
    if (isNaN(p)) return null;
    return clamp100(100 - (p - 1) * (100 / 19));
  }
  function paceScoreFromRatio(carMs, myMs) {
    if (carMs == null || myMs == null || carMs <= 0 || myMs <= 0) return null;
    return clamp100(50 + (carMs - myMs) / carMs * 150);
  }

  /** The "car" placement — the team's car performance derived from RACE DATA
   *  (this site has no real car data): median quali lap, median race lap and
   *  average grid/finish across the team's drivers. */
  function carPlacement(d, allDrivers) {
    var list = allDrivers || [];
    var teamDrivers = list.filter(function(x){ return x.series === d.series && x.team === d.team; });
    if (!teamDrivers.length) teamDrivers = [d];
    var laps = [], qualis = [], finishes = [], grids = [];
    teamDrivers.forEach(function(t){
      var s = t.seasonStats || {};
      if (s.paceMedianMs > 0) laps.push(Number(s.paceMedianMs));
      if (s.qualiMedianMs > 0) qualis.push(Number(s.qualiMedianMs));
      var af = parseFloat(s.avgFinish), ag = parseFloat(s.avgGrid);
      if (!isNaN(af) && af > 0) finishes.push(af);
      if (!isNaN(ag) && ag > 0) grids.push(ag);
    });
    function med(a){ if(!a.length) return null; var s=a.slice().sort(function(x,y){return x-y;}); var m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
    function mean(a){ if(!a.length) return null; return a.reduce(function(x,y){return x+y;},0)/a.length; }
    return { lapMs: med(laps), qualiMs: med(qualis), expFinish: mean(finishes), expGrid: mean(grids) };
  }

  /**
   * Season performance — 5 components, each 0–100, modelled on (but simpler
   * than) the Save Viewer because this site has no real car data.
   *  • Pace        = 30% quali lap + 70% average lap (vs the car's pace)
   *  • Qualifying  = grid position vs the car's expected grid
   *  • Racecraft   = positions gained + finish quality + podiums/DNFs
   *  • vs Teammate = 20% quali H2H + 20% average-lap H2H + 60% race results
   *  • Reliability = finish vs the car's expected finish (DNF fallback)
   * The car placement is derived from race data (quali pace + average lap +
   * race position), never from real car data. */
  function computeSeasonPerformance(d, ss, allDrivers) {
    ss = ss || {};
    var list = allDrivers || [];
    var team = d.team, car = d.car;
    var peers = [];
    var isSameCar = false;
    if (team) peers = list.filter(function(x){ return x.id !== d.id && x.team === team && x.series === d.series; });
    if (!peers.length && car) {
      peers = list.filter(function(x){ return x.id !== d.id && x.car === car && x.series === d.series; });
      isSameCar = true;
    }
    var carM = carPlacement(d, list);
    var results = ss.results || [];

    // Pace: quali lap 30% + average lap 70%.
    var qualiLap = paceScoreFromRatio(carM.qualiMs, ss.qualiMedianMs);
    var avgLap = paceScoreFromRatio(carM.lapMs, ss.paceMedianMs);
    if (qualiLap == null) qualiLap = posToScore(ss.avgGrid);
    if (avgLap == null) avgLap = posToScore(ss.avgGrid);
    if (qualiLap == null) qualiLap = 50;
    if (avgLap == null) avgLap = 50;
    var pace = clamp100(qualiLap * 0.3 + avgLap * 0.7);

    // Qualifying: grid vs car's expected grid (±1.5 leniency, top-3 bonus).
    var qualifying = 50;
    if (carM.expGrid != null) {
      results.forEach(function(r){
        var g = r.grid != null ? Number(r.grid) : 0;
        if (g <= 0) return;
        if (g < carM.expGrid - 1.5) qualifying += 5;
        else if (g > carM.expGrid + 1.5) qualifying -= 5;
        else qualifying += 2;
        if (g <= 3) qualifying += (g === 1 ? 5 : g === 2 ? 3 : 1);
      });
      qualifying = clamp100(qualifying);
    } else {
      var gs = posToScore(ss.avgGrid);
      qualifying = gs != null ? clamp100(gs + (ss.poles || 0) * 4) : 50;
    }

    // Racecraft: positions gained (overtaking proxy) + finish quality.
    var racecraft = 50;
    results.forEach(function(r){
      var g = r.grid != null ? Number(r.grid) : 0;
      var p = Number(r.pos) || 20;
      if (g > 0) racecraft += (g - p) * 3;
      if (p <= 3) racecraft += (p === 1 ? 5 : p === 2 ? 3 : 1);
      if (r.dnf) racecraft -= 5;
    });
    racecraft = clamp100(racecraft);

    // Reliability: finish vs car's expected finish + podium bonus.
    var reliability = (ss.smReliability != null) ? clamp100(Number(ss.smReliability)) : null;
    if (reliability == null) {
      if (carM.expFinish != null) {
        reliability = 50;
        results.forEach(function(r){
          var p = Number(r.pos) || 20;
          if (p < carM.expFinish - 1.5) reliability += 5;
          else if (p > carM.expFinish + 1.5) reliability -= 5;
          else reliability += 2;
          if (p <= 3) reliability += 3;
        });
        reliability = clamp100(reliability);
      } else {
        reliability = clamp100(100 - (ss.dnfs || 0) * 15);
      }
    }

    // vs Teammate: quali 20% + average lap 20% + race results 60%.
    var raceW = 0, raceL = 0, qualiW = 0, qualiL = 0, lapW = 0, lapL = 0;
    var peerByRace = {};
    peers.forEach(function(p){
      ((p.seasonStats && p.seasonStats.results) || []).forEach(function(r){
        var key = r.race != null ? r.race : r.trackId;
        if (key == null) return;
        if (!peerByRace[key]) peerByRace[key] = [];
        peerByRace[key].push(r);
      });
    });
    results.forEach(function(r){
      var key = r.race != null ? r.race : r.trackId;
      var myPos = Number(r.pos) || 99;
      var myGrid = r.grid != null ? Number(r.grid) : 0;
      var myLap = r.fastest != null ? Number(r.fastest) : (r.fl != null ? Number(r.fl) : null);
      (peerByRace[key] || []).forEach(function(pr){
        var tmPos = Number(pr.pos) || 99;
        if (myPos < tmPos) raceW++; else raceL++;
        var tmGrid = pr.grid != null ? Number(pr.grid) : 0;
        if (myGrid > 0 && tmGrid > 0) { if (myGrid < tmGrid) qualiW++; else qualiL++; }
        var tmLap = pr.fastest != null ? Number(pr.fastest) : (pr.fl != null ? Number(pr.fl) : null);
        if (myLap > 0 && tmLap > 0) { if (myLap < tmLap) lapW++; else lapL++; }
      });
    });
    var racePct = raceW + raceL > 0 ? (raceW / (raceW + raceL)) * 100 : null;
    var qualiPct = qualiW + qualiL > 0 ? (qualiW / (qualiW + qualiL)) * 100 : null;
    var lapPct = lapW + lapL > 0 ? (lapW / (lapW + lapL)) * 100 : null;
    var parts = [];
    if (qualiPct != null) parts.push({ w: 0.2, v: qualiPct });
    if (lapPct != null) parts.push({ w: 0.2, v: lapPct });
    if (racePct != null) parts.push({ w: 0.6, v: racePct });
    var teammate = 50;
    if (parts.length) {
      var wsum = 0, vsum = 0;
      parts.forEach(function(x){ wsum += x.w; vsum += x.w * x.v; });
      teammate = clamp100(vsum / wsum);
    }

    var overall = clamp100((pace + qualifying + racecraft + teammate + reliability) / 5);
    return {
      label: isSameCar ? 'vs Same Car' : 'vs Teammate',
      pace: pace, qualifying: qualifying, racecraft: racecraft,
      teammate: teammate, reliability: reliability, overall: overall
    };
  }

  /** Compute favorite track from season results (best average finish, count best). */
  function computeFavoriteTrack(d) {
    var results = (d.seasonStats && d.seasonStats.results) || [];
    if (!results.length) return null;
    var byTrack = {};
    results.forEach(function(r) {
      if (!byTrack[r.track]) byTrack[r.track] = { sum:0, count:0, best:99, bestCount:0 };
      var t = byTrack[r.track];
      t.sum += r.pos; t.count++;
      if (r.pos < t.best) t.best = r.pos;
    });
    // Count best results across all tracks for each track
    results.forEach(function(r) {
      var t = byTrack[r.track];
      if (r.pos === t.best) t.bestCount++;
    });
    var bestTrack = null, bestScore = 999;
    Object.keys(byTrack).forEach(function(track) {
      var t = byTrack[track];
      var score = (t.sum / t.count) - (t.bestCount * 2);
      if (score < bestScore) { bestScore = score; bestTrack = t; bestTrack.track = track; }
    });
    return bestTrack;
  }

  /** Build the TFG dot-plot sparkline (start→finish per race). */
  function buildSparkline(d) {
    var results = (d.seasonStats && d.seasonStats.results) || [];
    var color = (d.teamColor || '185,29,46');
    return results.map(function(r, i) {
      var sp = r.grid || 20, fp = r.pos || 20;
      var sy = ((sp - 1) / 19) * 80, fy = ((fp - 1) / 19) * 80;
      var label = abbreviate(r.track) || 'R' + (i+1);
      return '<div class="dp-sparkline__race" title="'+BTG.esc(label)+': P'+sp+'→P'+fp+'">'
        + '<div class="dp-sparkline__track">'
        + (!r.dnf ? '<div class="dp-sparkline__line" style="top:'+Math.min(sy,fy)+'px;height:'+(Math.abs(fy-sy)+3)+'px;background:rgb('+color+')"></div>' : '')
        + '<div class="dp-sparkline__dot" style="top:'+fy+'px;background:'+(r.dnf?'#ef4444':'#34d399')+'"></div>'
        + '<div class="dp-sparkline__dot" style="top:'+sy+'px;background:#f472b6"></div>'
        + '</div>'
        + '<span class="dp-sparkline__label">'+BTG.esc(label)+'</span>'
        + '</div>';
    }).join('') || '<div class="dp-empty">No race data.</div>';
  }

  function abbreviate(track) {
    if (!track) return '';
    var map = {
      'Bahrain':'BHR','Melbourne':'MEL','Shanghai':'CHN','Jeddah':'JED','Miami Gardens':'MIA',
      'Monaco':'MON','Montreal':'CAN','Suzuka':'JPN','Silverstone':'GBR','Monza':'ITA',
      'Spielberg':'AUT','Sakhir':'BHR','Montmeló':'ESP','Mogyoród':'HUN','Zandvoort':'NED',
      'Stavelot':'BEL','Austin':'USA','Mexico City':'MEX','São Paulo':'BRA','Las Vegas':'LVG',
      'Yas Island':'ABU','Imola':'EMI','Baku':'AZE','Lusail':'QAT','Downtown Core':'SIN'
    };
    return map[track] || track.slice(0,3).toUpperCase();
  }

  /** Clamp a derived performance value to 0–100. */
  function perfVal(ss, raw) {
    if (raw == null || isNaN(raw)) return 0;
    return Math.max(0, Math.min(100, Math.round(raw)));
  }

  /**
   * Head-to-head metric for a driver.
   *  • Teamed entry → "vs Teammate" (compare to the other driver in the team).
   *  • Teamless entry (XGT/GT) → "vs Same Car" — compared to other drivers on
   *    the same car, using median lap pace. Weighted 2× from F1 (same-car is a
   *    much stronger comparison than a teammate within a constructor).
   * Returns { label, val (0–100), reliability (0–100), pace, quali }.
   */
  function computeH2H(d, ss, allDrivers) {
    var list = allDrivers || [];
    var car = d.car;
    var team = d.team;

    // Gather peers: teammates if the entry has a team, else same-car drivers.
    // When a team exists but has no teammate (or the team filter finds nobody),
    // fall back to "vs Same Car" — per spec, no teammate ⇒ same-car comparison.
    var peers;
    var isSameCar = false;
    if (team) {
      peers = list.filter(function(x) { return x.id !== d.id && x.team === team && x.series === d.series; });
    }
    if (!peers || !peers.length) {
      peers = list.filter(function(x) { return x.id !== d.id && x.car === car && x.series === d.series; });
      isSameCar = true;
    }

    // Reliability: AMS median-based when available, else DNF-based fallback
    var reliability = (ss && ss.smReliability != null)
      ? ss.smReliability
      : perfVal(ss, 100 - (ss.dnfs||0)*15);
    var weight = isSameCar ? 2 : 1; // same-car comparison is 2× from F1

    // Median lap-pace comparison (AMS Second Monitor data)
    var myPace = ss && ss.paceMedianMs;
    var peerPace = peers
      .map(function(p) { return p.seasonStats && p.seasonStats.paceMedianMs; })
      .filter(function(v) { return v != null && v > 0; });
    var pace, quali;
    if (myPace > 0 && peerPace.length) {
      var avgPeerPace = peerPace.reduce(function(a,b){return a+b;},0) / peerPace.length;
      var paceRatio = myPace / avgPeerPace; // <1 = faster than peers
      pace = perfVal(ss, 50 + (1 - paceRatio) * 50 * weight);
    } else {
      pace = perfVal(ss, 100 - ss.avgGrid);
    }

    // Median qualifying-lap comparison (AMS Second Monitor quali files)
    var myQuali = ss && ss.qualiMedianMs;
    var peerQuali = peers
      .map(function(p) { return p.seasonStats && p.seasonStats.qualiMedianMs; })
      .filter(function(v) { return v != null && v > 0; });
    if (myQuali > 0 && peerQuali.length) {
      var avgPeerQuali = peerQuali.reduce(function(a,b){return a+b;},0) / peerQuali.length;
      var qualiRatio = myQuali / avgPeerQuali;
      quali = perfVal(ss, 50 + (1 - qualiRatio) * 50 * weight);
    } else {
      quali = perfVal(ss, 100 - ss.avgGrid);
    }

    // Head-to-head win percentage — compare the driver against each peer
    // race-by-race (finishing position) and in qualifying (grid position),
    // matching the Save Viewer driver-profile calculation. A tie = loss.
    var wins = 0, losses = 0;
    var peerByRace = {};
    peers.forEach(function(p) {
      ((p.seasonStats && p.seasonStats.results) || []).forEach(function(r) {
        if (r.race == null) return;
        if (!peerByRace[r.race]) peerByRace[r.race] = [];
        peerByRace[r.race].push(r);
      });
    });
    ((ss && ss.results) || []).forEach(function(r) {
      var myPos = Number(r.pos) || 99;
      var myGrid = r.grid != null ? Number(r.grid) : 0;
      (peerByRace[r.race] || []).forEach(function(pr) {
        var tmPos = Number(pr.pos) || 99;
        if (myPos < tmPos) wins++; else losses++;
        var tmGrid = pr.grid != null ? Number(pr.grid) : 0;
        if (myGrid > 0 && tmGrid > 0) {
          if (myGrid < tmGrid) wins++; else losses++;
        }
      });
    });
    var val = wins + losses > 0 ? Math.round((wins / (wins + losses)) * 100) : 50;

    return { label: isSameCar ? 'vs Same Car' : 'vs Teammate', val: val, reliability: reliability, pace: pace, quali: quali };
  }

  /** Simple verdict headline from season performance. */
  function seasonVerdict(d, ss) {
    var pos = d.standings ? d.standings.pos : 99;
    if (pos <= 3) return 'Championship Contender';
    if (pos <= 6) return 'Strong Season';
    if (pos <= 10) return 'Midfield Battle';
    if (pos <= 15) return 'Career Crossroads';
    return 'Struggling';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      selectedDriverId = null;
      BTG.resetTeamColors();
      document.querySelectorAll('.dp-picker__chip').forEach(function(x){x.classList.remove('dp-picker__chip--active');});
      document.getElementById('detail-panel').className = 'dp-empty';
      document.getElementById('detail-panel').innerHTML = 'Select a driver from the list.';
    }
  });

  // ── Sidebar toggle (slides the sidebar in/out; same inline styling on all screens) ──
  var layoutEl = document.getElementById('dp-layout');
  function closeSidebar() { if (layoutEl) layoutEl.classList.add('sb-collapsed'); }
  function toggleSidebar() { if (layoutEl) layoutEl.classList.toggle('sb-collapsed'); }
  var sbCollapse = document.getElementById('sb-collapse');
  var sbToggle = document.getElementById('sb-toggle');
  if (sbCollapse) sbCollapse.onclick = closeSidebar;
  if (sbToggle) sbToggle.onclick = toggleSidebar;
})();
</script>
