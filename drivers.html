<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeTheGrid — Drivers</title>
<link rel="icon" type="image/x-icon" href="logos/BTG.ico">
<link rel="stylesheet" href="style.css">
<style>
/* ── TFG base tokens ─────────────────────────────────────────────────────── */
:root {
  --bg-base: #18181b;
  --bg-card: #0e0e12;
  --bg-card-hover: #131318;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.14);
  --text-primary: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --text-disabled: #52525b;
  --accent: #dc2626;
  --accent-light: #f87171;
  --accent-bg: rgba(220,38,38,0.08);
  --accent-border: rgba(220,38,38,0.25);
  --font-mono: ui-monospace, Menlo, Monaco, 'Cascadia Mono', 'Segoe UI Mono',
    'Roboto Mono', 'Oxygen Mono', 'Ubuntu Monospace', 'Source Code Pro',
    'Fira Mono', 'Droid Sans Mono', 'Courier New', monospace;
  --team-rgb: 220, 38, 38;
}

@font-face {
  font-family: 'Formula1';
  src: url('fonts/AlfaqixDiode-SemiBold.otf') format('opentype');
  font-weight: 600;
  font-display: swap;
}

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
/* Viewport-pinned glows so they never cut off / repeat on long pages */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(circle at top left, rgba(220, 38, 38, 0.12), transparent 32%),
    radial-gradient(circle at 85% 12%, rgba(239, 68, 68, 0.1), transparent 28%),
    linear-gradient(180deg, rgba(255, 255, 255, 0.01), transparent 20%);
}

/* ── TFG Layout ──────────────────────────────────────────────────────────── */
.dp-layout { display: grid; grid-template-columns: 260px 1fr; gap: 0; min-height: calc(100vh - 120px); max-width: 1400px; margin: 0 auto; transition: grid-template-columns 0.25s ease; }
.dp-layout.sb-collapsed { grid-template-columns: 0 1fr; }
.dp-layout.sb-collapsed .dp-picker { border-right: 0; }
.dp-picker { background: rgba(0,0,0,0.25); border-right: 1px solid var(--border-subtle); padding: 10px 0; overflow-y: auto; max-height: calc(100vh - 120px); position: sticky; top: 56px; min-width: 0; }
.dp-picker__title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-disabled); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dp-picker__toggle { border: 1px solid var(--border-subtle); background: transparent; color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; line-height: 1.4; flex: none; }
.dp-picker__toggle:hover { color: var(--text-primary); border-color: var(--border-medium); }
.dp-picker__group { padding: 4px 0; }
.dp-picker__team { display: flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.dp-picker__chip { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 14px; border: none; border-left: 3px solid transparent; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12px; text-align: left; transition: all 100ms; }
.dp-picker__chip:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
.dp-picker__chip--active { background: rgba(255,255,255,0.05) !important; color: var(--text-primary) !important; font-weight: 600; border-left-color: rgb(var(--team-rgb)); }
.dp-picker__flag { height: 14px; border: 1px solid rgba(255,255,255,0.15); }
.dp-picker__name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dp-picker__num { font-size: 10px; color: var(--text-disabled); font-family: var(--font-mono); }
/* Floating toggle — always visible, toggles the sidebar open/closed (same inline styling, slides in/out) */
.dp-sidebar-toggle { position: fixed; left: 8px; bottom: 12px; z-index: 65; border: 1px solid var(--border-subtle); background: #161618; color: var(--text-muted); font-size: 10px; font-family: var(--font-mono); padding: 5px 9px; border-radius: 4px; cursor: pointer; }
.dp-sidebar-toggle:hover { color: var(--text-primary); }

/* ── TFG Cards (glow via --team-rgb) ─────────────────────────────────────── */
.dp-main { display: grid; grid-template-columns: 1fr 1.1fr 0.9fr; gap: 12px; padding: 12px; overflow-y: auto; }
@media (max-width: 1100px) { .dp-main { grid-template-columns: 1fr 1fr; } }
@media (max-width: 760px) { .dp-main { grid-template-columns: 1fr; } }
.dp-left, .dp-center, .dp-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.dp-card, .dash-overview__col {
  border: 1px solid rgb(var(--team-rgb, 99 102 241) / 0.35);
  border-radius: 6px;
  background: #161618;
  box-shadow: 0 0 8px rgb(var(--team-rgb, 99 102 241) / 0.08);
  position: relative;
  overflow: visible;
  transition: border-color 0.2s, box-shadow 0.2s;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.dp-card::after, .dash-overview__col::after {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 10px;
  pointer-events: none;
  z-index: 0;
  opacity: 0.4;
  box-shadow:
    0 0 8px 2px rgb(var(--team-rgb, 99 102 241) / 0.25),
    0 0 18px 5px rgb(var(--team-rgb, 99 102 241) / 0.1);
  mask-image:
    conic-gradient(
      from var(--cursor-angle, 45deg) at center,
      black 0deg, transparent 60deg, transparent 300deg, black 360deg
    );
}
.dp-card:hover, .dash-overview__col:hover {
  border-color: rgb(var(--team-rgb, 99 102 241) / 0.55);
  box-shadow: 0 0 14px rgb(var(--team-rgb, 99 102 241) / 0.14);
}
.dp-card__title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); margin-bottom: 10px; }
.dp-card__subtitle { font-size: 10px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }

/* ── Hero ────────────────────────────────────────────────────────────────── */
.dp-hero { display: flex; align-items: flex-start; gap: 12px; position: relative; }
.dp-hero__photo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--border-medium); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; background: rgba(0,0,0,0.3); }
.dp-hero__img { width: 100%; height: 100%; object-fit: cover; }
.dp-hero__placeholder { font-size: 24px; color: var(--text-muted); }
.dp-hero__info { flex: 1; min-width: 0; }
.dp-hero__name { display: flex; flex-direction: column; }
.dp-hero__first { font-size: 11px; color: var(--text-secondary); }
.dp-hero__last { font-size: 18px; font-weight: 800; text-transform: uppercase; color: var(--text-primary); letter-spacing: -0.02em; font-family: 'Formula1', sans-serif; }
.dp-hero__meta { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.dp-hero__flag { height: 12px; border: 1px solid var(--border-medium); }
.dp-hero__sep { color: var(--text-disabled); }
.dp-hero__team { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; margin-top: 4px; }
.dp-hero__team-dot { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.dp-hero__number { position: absolute; top: 4px; right: 8px; font-size: 36px; font-weight: 900; color: rgba(255,255,255,0.04); font-family: 'Formula1', sans-serif; }

/* ── Contract ────────────────────────────────────────────────────────────── */
.dp-contract { display: flex; flex-direction: column; gap: 8px; }
.dp-contract__row { display: flex; justify-content: space-between; align-items: center; }
.dp-contract__label { font-size: 11px; color: var(--text-muted); }
.dp-contract__val { font-size: 13px; font-weight: 700; color: var(--text-secondary); }

/* ── Season Position ─────────────────────────────────────────────────────── */
.dp-pos { display: flex; align-items: baseline; gap: 12px; }
.dp-pos__rank { font-size: 28px; font-weight: 900; color: var(--text-primary); font-family: 'Formula1', sans-serif; }
.dp-pos__pts { font-size: 13px; color: var(--text-secondary); font-weight: 600; }

/* ── Last Season ─────────────────────────────────────────────────────────── */
.dp-prev { display: flex; flex-direction: column; gap: 6px; }
.dp-prev__row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-bottom: 1px solid var(--border-subtle); }
.dp-prev__row span:first-child { color: var(--text-secondary); }
.dp-prev__row span:last-child { font-weight: 600; color: var(--text-primary); }

/* ── Favorite Track ──────────────────────────────────────────────────────── */
.dp-fav-track { display: flex; align-items: center; gap: 8px; }
.dp-fav-track__flag { width: 24px; height: 16px; border: 1px solid var(--border-medium); }
.dp-fav-track__name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.dp-fav-track__note { font-size: 9px; color: var(--text-muted); }

/* ── Season Performance ──────────────────────────────────────────────────── */
.dp-grade__overall { font-size: 48px; font-weight: 900; text-align: center; padding: 4px 0; margin-bottom: 12px; letter-spacing: -0.02em; font-family: 'Formula1', sans-serif; }
.dp-grade__bars { display: flex; flex-direction: column; gap: 5px; }
.dp-grade__row { display: flex; align-items: center; gap: 8px; }
.dp-grade__label { font-size: 9px; color: var(--text-muted); width: 80px; text-align: right; flex-shrink: 0; }
.dp-grade__bar { flex: 1; height: 6px; background: var(--border-subtle); }
.dp-grade__fill { height: 100%; transition: width 300ms; }
.dp-grade__val { font-size: 10px; font-weight: 700; color: var(--text-secondary); width: 24px; text-align: center; }

/* ── Letter grade colors ─────────────────────────────────────────────────── */
.gr { font-weight: 600; }
.gr-a { color: #34d399; } .gr-b { color: #4a9fd4; } .gr-c { color: #f59e0b; }
.gr-d { color: #f97316; } .gr-f { color: var(--text-muted); }

/* ── Season Race Positions ───────────────────────────────────────────────── */
.dp-sparkline { display: flex; gap: 2px; overflow-x: auto; padding-bottom: 4px; }
.dp-sparkline__race { display: flex; flex-direction: column; align-items: center; min-width: 24px; }
.dp-sparkline__track { position: relative; width: 20px; height: 90px; }
.dp-sparkline__line { position: absolute; left: 50%; transform: translateX(-50%); width: 2px; opacity: 0.6; }
.dp-sparkline__dot { position: absolute; left: 50%; transform: translate(-50%,-50%); width: 5px; height: 5px; border-radius: 50%; }
.dp-sparkline__label { font-size: 7px; color: var(--text-disabled); margin-top: 2px; }

/* ── Stats Grid ──────────────────────────────────────────────────────────── */
.dp-stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
.dp-stat { text-align: center; padding: 6px 4px; background: var(--border-subtle); border: 1px solid var(--border-subtle); }
.dp-stat__val { font-size: 16px; font-weight: 800; color: var(--text-primary); }
.dp-stat__lbl { font-size: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

/* ── Verdict ─────────────────────────────────────────────────────────────── */
.dp-verdict__label { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
.dp-verdict__stats { display: flex; gap: 10px; margin-bottom: 10px; }
.dp-verdict__stat { text-align: center; }
.dp-verdict__val { display: block; font-size: 18px; font-weight: 800; color: var(--accent-light); }
.dp-verdict__lbl { font-size: 8px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
.dp-verdict__bullets { margin: 0; padding: 0 0 0 16px; font-size: 11px; color: var(--text-secondary); line-height: 1.6; }

/* ── Career Race Record ──────────────────────────────────────────────────── */
.dp-career-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }

/* ── Past Seasons ────────────────────────────────────────────────────────── */
.dp-past-head { display: grid; grid-template-columns: 34px minmax(0,1fr) repeat(4, 34px) 44px; gap: 6px; align-items: center; padding: 6px 16px; font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-disabled); border-bottom: 1px solid var(--border-subtle); }
.dp-past-head .tm { min-width: 0; }
.dp-past-head .px { text-align: right; }
.dp-past-head .ps { text-align: right; }
.dp-past-row { display: grid; grid-template-columns: 34px minmax(0,1fr) repeat(4, 34px) 44px; gap: 6px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--border-subtle); font-size: 12px; min-width: 0; }
.dp-past-row:last-child { border-bottom: none; }
.dp-past-row .yr { font-family: var(--font-mono); color: var(--text-muted); }
.dp-past-row .tm { font-weight: 600; min-width: 0; display: flex; align-items: center; gap: 7px; overflow: hidden; }
.dp-past-row .tm > span:not(.sx) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dp-past-row .tm .team-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.dp-past-row .st { font-family: var(--font-mono); color: var(--text-secondary); font-size: 10px; }
.dp-past-row .sx { font-family: var(--font-mono); font-size: 9px; color: var(--text-disabled); text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--border-subtle); border-radius: 3px; padding: 1px 5px; flex: none; }
.dp-past-row .px { font-family: var(--font-mono); color: var(--text-secondary); font-size: 11px; text-align: right; }
.dp-past-row .ps { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); text-align: right; }
@media (max-width: 560px) {
  .dp-past-head, .dp-past-row { grid-template-columns: 30px minmax(0,1fr) repeat(2, 30px) 40px; }
  .dp-past-head .px:nth-of-type(3), .dp-past-head .px:nth-of-type(4),
  .dp-past-row .px:nth-of-type(3), .dp-past-row .px:nth-of-type(4) { display: none; }
}

/* ── Grid Penalties ──────────────────────────────────────────────────────── */
.dp-penalty { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 11px; color: var(--text-secondary); background: var(--border-subtle); margin-bottom: 2px; }

/* ── Career Timeline ─────────────────────────────────────────────────────── */
.dp-timeline { position: relative; padding: 26px 0 8px; }
.dp-timeline-track { position: relative; height: 42px; background: var(--border-subtle); overflow: hidden; }
.dp-timeline-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.dp-timeline-seg-label { font-size: 9px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.7); letter-spacing: 0.05em; font-family: var(--font-mono); }
.dp-timeline-years { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); margin-top: 4px; font-family: var(--font-mono); }

/* ── Controls bar ────────────────────────────────────────────────────────── */
.dp-controls { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--bg-card); border: 1px solid var(--border-subtle); flex-wrap: wrap; margin-bottom: 12px; }
.dp-controls .label { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.dp-controls select { background: #3a3a3a; border: 1px solid #4d4d4d; color: #ffffff; font-family: var(--font-mono); font-size: 12px; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
.dp-controls select option { background: #3a3a3a; color: #ffffff; }
.dp-series-logo { width: 64px; height: auto; display: block; flex-shrink: 0; }
.dp-spacer { flex: 1; }

/* ── Series selector glow (TFG-style) ─────────────────────────────────────── */
.series-tab { transition: color .15s, box-shadow .15s, border-color .15s; }
.series-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--series-color, var(--accent));
  box-shadow:
    0 0 10px color-mix(in srgb, var(--series-color, var(--accent)) 40%, transparent),
    inset 0 0 6px color-mix(in srgb, var(--series-color, var(--accent)) 20%, transparent);
}

/* ── TFG Timeline ────────────────────────────────────────────────────────── */
.dp-tl { background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 14px 20px; }
.dp-tl__years { display: flex; align-items: center; gap: 0; margin-bottom: 4px; }
.dp-tl__years span { flex: 1; text-align: center; font-size: 9px; color: var(--text-disabled); font-weight: 600; }
.dp-tl__track { display: flex; align-items: stretch; gap: 0; }
.dp-tl__cell {
  flex: 1; height: 30px; position: relative;
  display: flex; align-items: center; justify-content: center; gap: 3px;
}
.dp-tl__cell img { max-height: 12px; width: auto; z-index: 1; opacity: 0.9; }
.dp-tl__mark {
  position: absolute; left: 50%; top: -8px; transform: translateX(-50%);
  font-size: 8px; color: #fbbf24; font-weight: 700;
  text-shadow: 0 0 3px rgba(0,0,0,0.8); z-index: 2;
}
.dp-tl__legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 10px; color: var(--text-muted); }
.dp-tl__legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }

/* ── Attribution ─────────────────────────────────────────────────────────── */
.tfg-attrib { position: fixed; bottom: 12px; right: 16px; font-size: 9px; color: var(--text-disabled); z-index: 60; font-family: var(--font-mono); }
.tfg-attrib a { color: var(--text-disabled); text-decoration: underline; }
.tfg-attrib a:hover { color: var(--text-muted); }

/* ── Empty state ─────────────────────────────────────────────────────────── */
.dp-empty { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body data-page="drivers">

<nav class="btg-nav" id="btg-nav"></nav>

<div style="max-width:1400px;margin:0 auto;padding:0 16px;">

  <!-- Controls: series tabs + season selector -->
  <div class="dp-controls">
    <div class="series-bar" id="series-bar" style="border:none;background:none;padding:0;"></div>
    <span class="dp-spacer"></span>
    <span class="label">Season</span>
    <select id="season-select"></select>
  </div>

  <!-- Sidebar + Detail -->
  <div class="dp-layout" id="dp-layout">
    <div class="dp-picker" id="sidebar">
      <div class="dp-picker__title" id="sb-head">
        <span>Drivers</span>
        <button class="dp-picker__toggle" id="sb-collapse" title="Hide sidebar" type="button">‹</button>
      </div>
      <div id="sb-list"></div>
    </div>
    <div id="detail-panel" class="dp-empty">Select a driver from the list.</div>
  </div>
  <button class="dp-sidebar-toggle" id="sb-toggle" type="button">☰ Drivers</button>
</div>

<div class="tfg-attrib">UI by <a href="https://www.patreon.com/c/TFGTools" target="_blank" rel="noopener">TFGTools</a></div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/border-glow.js"></script>
<script src="teams/f1.js"></script>
<script src="js/data-loader.js"></script>
<script>
(function() {
  var drivers = [], activeSeries = null, seriesList = [];
  var seasons = [], activeSeason = null;
  var selectedDriverId = null;

  // Load from cache (fast) — init() resolves immediately and auto-discovery
  // runs in the background, re-triggering load() via onUpdate when it lands.
  BTG.Data.init().then(load).catch(function() {
    BTG.useDemo(); drivers = BTG.DEMO.drivers;
    seriesList = ['F1']; activeSeries = 'F1';
    seasons = [2026]; activeSeason = 2026;
    build();
  });
  BTG.Data.onUpdate(load);

  function load() {
    // Build series list from discovered data, preserving selection if possible
    seriesList = BTG.Data.getSeriesList().map(function(s){return s.id;});
    if (seriesList.indexOf(activeSeries) === -1) activeSeries = seriesList[0] || 'F1';
    seasons = BTG.Data.getSeasons(activeSeries);
    if (seasons.indexOf(activeSeason) === -1) activeSeason = seasons[0] || 2026;
    drivers = BTG.Data.buildDriverList(activeSeries, activeSeason, { includeAll: true });
    build();
  }

  function build() {
    var bar = document.getElementById('series-bar');
    bar.innerHTML = ''; // clear so re-renders (onUpdate) don't duplicate tabs
    seriesList.forEach(function(s) {
      var t = document.createElement('div');
      t.className = 'series-tab' + (s === activeSeries ? ' active' : '');
      // Accent color derived from the series data — never hardcoded per series name.
      t.style.setProperty('--series-color', BTG.seriesAccent(s));
      t.setAttribute('data-series', s);
      // Clickable series logo (auto-discovered from logos/{series}.png, clamped)
      t.innerHTML = BTG.seriesLogoImg(s, 26);
      t.title = s;
      t.onclick = function() {
        activeSeries = s;
        seasons = BTG.Data.getSeasons(s);
        activeSeason = seasons[0] || 2026;
        rebuildSeasonSelect();
        drivers = BTG.Data.buildDriverList(s, activeSeason, { includeAll: true });
        selectedDriverId = null;
        renderSidebar();
        document.getElementById('detail-panel').className = 'dp-empty';
        document.getElementById('detail-panel').innerHTML = 'Select a driver from the list.';
        bar.querySelectorAll('.series-tab').forEach(function(x){x.classList.toggle('active',x.getAttribute('data-series')===s);});
      };
      bar.appendChild(t);
    });

    rebuildSeasonSelect();
    renderSidebar();
  }

  function rebuildSeasonSelect() {
    var sel = document.getElementById('season-select');
    sel.innerHTML = '';
    seasons.forEach(function(s) { var o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
    sel.value = activeSeason;
    sel.onchange = function() {
      activeSeason = Number(this.value);
      drivers = BTG.Data.buildDriverList(activeSeries, activeSeason, { includeAll: true });
      selectedDriverId = null;
      renderSidebar();
      document.getElementById('detail-panel').className = 'dp-empty';
      document.getElementById('detail-panel').innerHTML = 'Select a driver from the list.';
    };
  }

  function getSeriesDrivers() {
    return (BTG.groupBySeries(drivers)[activeSeries] || [])
      .sort(function(a,b) {

  function gradeOf(v) { if(v>=90)return 'A';if(v>=80)return 'B+';if(v>=70)return 'B';if(v>=60)return 'C+';if(v>=50)return 'C';if(v>=40)return 'D+';if(v>=30)return 'D';return 'F'; }
  function gradeCls(g){return 'gr gr-'+g[0].toLowerCase();}
  function gbar(label, val, color) {
    var g = gradeOf(val);
    return '<div class="dp-grade__row"><span class="dp-grade__label">'+label+'</span>'
      + '<div class="dp-grade__bar"><div class="dp-grade__fill" style="width:'+Math.max(0,Math.min(100,val))+'%;background:'+color+'"></div></div>'
      + '<span class="dp-grade__val '+gradeCls(g)+'">'+g+'</span></div>';
  }
  function statCell(v, l) { return '<div class="dp-stat"><div class="dp-stat__val">'+v+'</div><div class="dp-stat__lbl">'+l+'</div></div>'; }

  /** Derive a 0–100 overall performance score from real season stats. */
  function computeOverallScore(d, ss) {
    var score = 0;
    var pos = d.standings ? d.standings.pos : 99;
    if (pos !== '—' && !isNaN(pos)) score += Math.max(0, 100 - ((pos - 1) * 5));
    score += (ss.wins || 0) * 10;
    score += (ss.podiums || 0) * 3;
    score -= (ss.dnfs || 0) * 6;
    if (ss.avgFinish && ss.avgFinish !== '—') {
      var af = parseFloat(ss.avgFinish);
      if (!isNaN(af)) score += Math.max(0, 100 - (af * 3));
    }
    return Math.max(0, Math.min(100, score));
  }

  /** Compute favorite track from season results (best average finish, count best). */
  function computeFavoriteTrack(d) {
    var results = (d.seasonStats && d.seasonStats.results) || [];
    if (!results.length) return null;
    var byTrack = {};
    results.forEach(function(r) {
      if (!byTrack[r.track]) byTrack[r.track] = { sum:0, count:0, best:99, bestCount:0 };
      var t = byTrack[r.track];
      t.sum += r.pos; t.count++;
      if (r.pos < t.best) t.best = r.pos;
    });
    // Count best results across all tracks for each track
    results.forEach(function(r) {
      var t = byTrack[r.track];
      if (r.pos === t.best) t.bestCount++;
    });
    var bestTrack = null, bestScore = 999;
    Object.keys(byTrack).forEach(function(track) {
      var t = byTrack[track];
      var score = (t.sum / t.count) - (t.bestCount * 2);
      if (score < bestScore) { bestScore = score; bestTrack = t; bestTrack.track = track; }
    });
    return bestTrack;
  }

  /** Build the TFG dot-plot sparkline (start→finish per race). */
  function buildSparkline(d) {
    var results = (d.seasonStats && d.seasonStats.results) || [];
    var color = (d.teamColor || '185,29,46');
    return results.map(function(r, i) {
      var sp = r.grid || 20, fp = r.pos || 20;
      var sy = ((sp - 1) / 19) * 80, fy = ((fp - 1) / 19) * 80;
      var label = abbreviate(r.track) || 'R' + (i+1);
      return '<div class="dp-sparkline__race" title="'+BTG.esc(label)+': P'+sp+'→P'+fp+'">'
        + '<div class="dp-sparkline__track">'
        + (!r.dnf ? '<div class="dp-sparkline__line" style="top:'+Math.min(sy,fy)+'px;height:'+(Math.abs(fy-sy)+3)+'px;background:rgb('+color+')"></div>' : '')
        + '<div class="dp-sparkline__dot" style="top:'+fy+'px;background:'+(r.dnf?'#ef4444':'#34d399')+'"></div>'
        + '<div class="dp-sparkline__dot" style="top:'+sy+'px;background:#f472b6"></div>'
        + '</div>'
        + '<span class="dp-sparkline__label">'+BTG.esc(label)+'</span>'
        + '</div>';
    }).join('') || '<div class="dp-empty">No race data.</div>';
  }

  function abbreviate(track) {
    if (!track) return '';
    var map = {
      'Bahrain':'BHR','Melbourne':'MEL','Shanghai':'CHN','Jeddah':'JED','Miami Gardens':'MIA',
      'Monaco':'MON','Montreal':'CAN','Suzuka':'JPN','Silverstone':'GBR','Monza':'ITA',
      'Spielberg':'AUT','Sakhir':'BHR','Montmeló':'ESP','Mogyoród':'HUN','Zandvoort':'NED',
      'Stavelot':'BEL','Austin':'USA','Mexico City':'MEX','São Paulo':'BRA','Las Vegas':'LVG',
      'Yas Island':'ABU','Imola':'EMI','Baku':'AZE','Lusail':'QAT','Downtown Core':'SIN'
    };
    return map[track] || track.slice(0,3).toUpperCase();
  }

  /** Clamp a derived performance value to 0–100. */
  function perfVal(ss, raw) {
    if (raw == null || isNaN(raw)) return 0;
    return Math.max(0, Math.min(100, Math.round(raw)));
  }

  /**
   * Head-to-head metric for a driver.
   *  • Teamed entry → "vs Teammate" (compare to the other driver in the team).
   *  • Teamless entry (XGT/GT) → "vs Same Car" — compared to other drivers on
   *    the same car, using median lap pace. Weighted 2× from F1 (same-car is a
   *    much stronger comparison than a teammate within a constructor).
   * Returns { label, val (0–100), reliability (0–100), pace, quali }.
   */
  function computeH2H(d, ss, allDrivers) {
    var list = allDrivers || [];
    var car = d.car;
    var team = d.team;

    // Gather peers: teammates if the entry has a team, else same-car drivers.
    // When a team exists but has no teammate (or the team filter finds nobody),
    // fall back to "vs Same Car" — per spec, no teammate ⇒ same-car comparison.
    var peers;
    var isSameCar = false;
    if (team) {
      peers = list.filter(function(x) { return x.id !== d.id && x.team === team && x.series === d.series; });
    }
    if (!peers || !peers.length) {
      peers = list.filter(function(x) { return x.id !== d.id && x.car === car && x.series === d.series; });
      isSameCar = true;
    }

    // Reliability: AMS median-based when available, else DNF-based fallback
    var reliability = (ss && ss.smReliability != null)
      ? ss.smReliability
      : perfVal(ss, 100 - (ss.dnfs||0)*15);
    var weight = isSameCar ? 2 : 1; // same-car comparison is 2× from F1

    // Median lap-pace comparison (AMS Second Monitor data)
    var myPace = ss && ss.paceMedianMs;
    var peerPace = peers
      .map(function(p) { return p.seasonStats && p.seasonStats.paceMedianMs; })
      .filter(function(v) { return v != null && v > 0; });
    var pace, quali;
    if (myPace > 0 && peerPace.length) {
      var avgPeerPace = peerPace.reduce(function(a,b){return a+b;},0) / peerPace.length;
      var paceRatio = myPace / avgPeerPace; // <1 = faster than peers
      pace = perfVal(ss, 50 + (1 - paceRatio) * 50 * weight);
    } else {
      pace = perfVal(ss, 100 - ss.avgGrid);
    }

    // Median qualifying-lap comparison (AMS Second Monitor quali files)
    var myQuali = ss && ss.qualiMedianMs;
    var peerQuali = peers
      .map(function(p) { return p.seasonStats && p.seasonStats.qualiMedianMs; })
      .filter(function(v) { return v != null && v > 0; });
    if (myQuali > 0 && peerQuali.length) {
      var avgPeerQuali = peerQuali.reduce(function(a,b){return a+b;},0) / peerQuali.length;
      var qualiRatio = myQuali / avgPeerQuali;
      quali = perfVal(ss, 50 + (1 - qualiRatio) * 50 * weight);
    } else {
      quali = perfVal(ss, 100 - ss.avgGrid);
    }

    // The H2H score: median pace vs peers, weighted 2× for same-car
    var val;
    if (myPace > 0 && peerPace.length) {
      val = perfVal(ss, 50 + (pace - 50) * weight);
    } else {
      // Fallback: compare by average finishing position
      var myAvg = ss && ss.avgFinish && ss.avgFinish !== '—' ? parseFloat(ss.avgFinish) : null;
      var peerAvgs = peers
        .map(function(p) { return p.seasonStats && p.seasonStats.avgFinish; })
        .filter(function(v) { return v && v !== '—'; })
        .map(parseFloat);
      if (myAvg != null && peerAvgs.length) {
        var avgPeer = peerAvgs.reduce(function(a,b){return a+b;},0) / peerAvgs.length;
        var ratio = myAvg / Math.max(0.1, avgPeer);
        val = perfVal(ss, 50 + (1 - ratio) * 50 * weight);
      } else {
        val = 0;
      }
    }

    return { label: isSameCar ? 'vs Same Car' : 'vs Teammate', val: val, reliability: reliability, pace: pace, quali: quali };
  }

  /** Simple verdict headline from season performance. */
  function seasonVerdict(d, ss) {
    var pos = d.standings ? d.standings.pos : 99;
    if (pos <= 3) return 'Championship Contender';
    if (pos <= 6) return 'Strong Season';
    if (pos <= 10) return 'Midfield Battle';
    if (pos <= 15) return 'Career Crossroads';
    return 'Struggling';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      selectedDriverId = null;
      BTG.resetTeamColors();
      document.querySelectorAll('.dp-picker__chip').forEach(function(x){x.classList.remove('dp-picker__chip--active');});
      document.getElementById('detail-panel').className = 'dp-empty';
      document.getElementById('detail-panel').innerHTML = 'Select a driver from the list.';
    }
  });

  // ── Sidebar toggle (slides the sidebar in/out; same inline styling on all screens) ──
  var layoutEl = document.getElementById('dp-layout');
  function closeSidebar() { if (layoutEl) layoutEl.classList.add('sb-collapsed'); }
  function toggleSidebar() { if (layoutEl) layoutEl.classList.toggle('sb-collapsed'); }
  var sbCollapse = document.getElementById('sb-collapse');
  var sbToggle = document.getElementById('sb-toggle');
  if (sbCollapse) sbCollapse.onclick = closeSidebar;
  if (sbToggle) sbToggle.onclick = toggleSidebar;
})();
</script>
</body>
