<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be The Grid — Dashboard Concept</title>
<style>
  :root {
    --bg: #0c0b0c; --surface: #161618; --surface-raised: #1e1e20; --surface-muted: #1a1a1c;
    --border: #2a2a2c; --border-strong: #3a3a3c; --text: #f5f1ee; --text-secondary: #b9b0ac;
    --text-tertiary: #847b77; --text-quaternary: #5a5552; --accent: #b91d2e; --accent-hot: #e8433f;
    --accent-on: #fff2f0; --positive: #4f9d6e; --warning: #d99a3d; --danger: #b91d2e;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: "SF Mono", "Fira Code", "JetBrains Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans); background: var(--bg); color: var(--text);
    font-size: 15px; line-height: 1.55; overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(140% 95% at 12% -12%, rgba(185,29,46,0.12), transparent 58%),
      radial-gradient(140% 95% at 88% 112%, rgba(101,13,23,0.12), transparent 58%),
      linear-gradient(180deg, rgba(0,0,0,0.4), rgba(0,0,0,0.1));
  }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .login-card {
    width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .login-mark { width: 8px; height: 28px; background: var(--accent); transform: skewX(-14deg); border-radius: 2px; }
  .login-title { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; }
  .login-sub { color: var(--text-tertiary); font-size: 14px; margin-bottom: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
  .field input, .field select, .field textarea {
    background: var(--surface-muted); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 11px 14px; font-size: 15px; color: var(--text); outline: none; transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent-hot); box-shadow: 0 0 0 3px rgba(185,29,46,0.15); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 22px; border-radius: 8px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.15s; background: var(--surface-raised);
    color: var(--text); text-transform: uppercase; letter-spacing: 0.03em;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn-primary { background: linear-gradient(180deg, var(--accent-hot), var(--accent)); color: var(--accent-on); }
  .btn-ghost { background: transparent; border: 1px solid var(--border-strong); }
  .btn-sm { padding: 7px 14px; font-size: 12px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border); padding: 16px 12px;
    display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: var(--text-tertiary); cursor: pointer;
    transition: all 0.15s; border-left: 3px solid transparent; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .nav-item:hover { background: var(--surface-muted); color: var(--text); }
  .nav-item.active { background: var(--surface-muted); color: var(--text); border-left-color: var(--accent); }
  .nav-icon { width: 20px; height: 20px; opacity: 0.7; flex-shrink: 0; }
  .nav-item.active .nav-icon { opacity: 1; }
  .nav-badge {
    margin-left: auto; background: var(--accent); color: white; font-family: var(--font-mono);
    font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 100px;
  }
  .main { padding: 24px 28px; overflow-y: auto; max-width: 1200px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-mark { width: 7px; height: 26px; background: var(--accent); transform: skewX(-14deg); border-radius: 2px; }
  .header-title { font-size: 20px; font-weight: 700; letter-spacing: 0.01em; text-transform: uppercase; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); }
  .pill-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-raised); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border: 1px solid var(--border); }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; position: relative; overflow: hidden; }
  .stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); }
  .stat-value { font-size: 32px; font-weight: 600; line-height: 1.1; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .stat-label { font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; transition: border-color 0.15s; }
  .card:hover { border-color: var(--border-strong); }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.1em; }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .table th { text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600; color: var(--text-tertiary); border-bottom: 2px solid var(--border); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
  .table td { padding: 10px 12px; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
  .table tr:hover td { background: var(--surface-muted); color: var(--text); }
  .table .col-strong { color: var(--text); font-weight: 600; }
  .hero { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
  .hero-photo { width: 80px; height: 80px; border-radius: 50%; background: var(--surface-muted); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 32px; position: relative; flex-shrink: 0; }
  .hero-number { position: absolute; bottom: -4px; right: -4px; background: var(--accent); color: white; font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; }
  .hero-name { font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.01em; }
  .hero-meta { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 14px; }
  .tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: rgba(185,29,46,0.12); color: var(--accent-hot); border: 1px solid rgba(185,29,46,0.25); }
  .tag-success { background: rgba(79,157,110,0.12); color: var(--positive); border-color: rgba(79,157,110,0.25); }
  .tag-warning { background: rgba(217,154,61,0.12); color: var(--warning); border-color: rgba(217,154,61,0.25); }
  .attr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .attr-group { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .attr-head { padding: 14px 18px; background: var(--surface-muted); border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  .attr-head::before { content: ""; width: 5px; height: 14px; background: var(--accent); transform: skewX(-14deg); border-radius: 2px; }
  .attr-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--border); gap: 16px; }
  .attr-row:last-child { border-bottom: none; }
  .attr-name { font-size: 14px; font-weight: 600; text-transform: uppercase; }
  .attr-weight { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
  .attr-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .attr-bar { width: 100px; height: 6px; background: var(--surface-muted); border-radius: 3px; overflow: hidden; }
  .attr-bar-fill { height: 100%; background: var(--text); border-radius: 3px; transition: width 0.3s; }
  .attr-val { font-family: var(--font-mono); font-size: 15px; font-weight: 600; min-width: 28px; text-align: right; }
  .attr-delta { font-size: 13px; color: var(--warning); min-width: 24px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface-muted); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-weight: 600; }
  .stepper button:hover:not(:disabled) { background: var(--border-strong); }
  .stepper button:disabled { opacity: 0.3; cursor: not-allowed; }
  .stepper button.plus { color: var(--accent-hot); }
  .aggr { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; }
  .aggr-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .aggr-level { font-size: 24px; font-weight: 700; text-transform: uppercase; }
  .aggr-num { font-family: var(--font-mono); font-size: 16px; color: var(--text-tertiary); }
  .slider-track { position: relative; height: 8px; background: var(--surface-muted); border-radius: 4px; cursor: pointer; }
  .slider-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, var(--positive), var(--warning), var(--danger)); transition: width 0.2s; }
  .slider-thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 0 12px rgba(185,29,46,0.4); cursor: grab; transition: left 0.2s; }
  .slider-labels { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; }
  .aggr-commit { display: flex; justify-content: flex-end; margin-top: 20px; gap: 12px; align-items: center; }
  .aggr-warn { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; padding: 12px 16px; background: rgba(217,154,61,0.08); border: 1px solid rgba(217,154,61,0.2); border-radius: 8px; font-size: 13px; color: var(--text-secondary); }
  .aggr-warn strong { color: var(--text); }
  .mail-app { display: grid; grid-template-columns: 180px 320px 1fr; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; height: 600px; }
  .mail-folders { background: var(--surface); border-right: 1px solid var(--border); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
  .folder { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--text-tertiary); cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.06em; }
  .folder:hover { background: var(--surface-muted); color: var(--text); }
  .folder.active { background: var(--surface-muted); color: var(--text); }
  .folder-count { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 100px; background: var(--surface-raised); color: var(--text-tertiary); }
  .folder.active .folder-count { background: var(--accent); color: white; }
  .mail-list { border-right: 1px solid var(--border); overflow-y: auto; background: var(--surface); display: flex; flex-direction: column; }
  .mail-search { padding: 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .mail-search input { width: 100%; background: var(--surface-muted); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--text); outline: none; font-family: inherit; }
  .mail-search input:focus { border-color: var(--accent-hot); }
  .mail-item { padding: 14px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: all 0.15s; position: relative; }
  .mail-item:hover { background: var(--surface-muted); }
  .mail-item.active { background: rgba(185,29,46,0.06); border-left: 3px solid var(--accent); padding-left: 13px; }
  .mail-item.unread::before { content: ""; position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .mail-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
  .mail-sender { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-date { font-family: var(--font-mono); font-size: 11px; color: var(--text-quaternary); white-space: nowrap; }
  .mail-subj { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-item.unread .mail-subj { color: var(--text); font-weight: 600; }
  .mail-preview { font-size: 12px; color: var(--text-quaternary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mail-read { padding: 24px; overflow-y: auto; background: transparent; }
  .read-header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
  .read-subj { font-size: 18px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
  .read-meta { display: flex; align-items: center; gap: 12px; }
  .read-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--text-secondary); flex-shrink: 0; }
  .read-body { font-size: 14px; line-height: 1.7; color: var(--text-secondary); white-space: pre-wrap; }
  .read-actions { display: flex; gap: 8px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
  .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .modal-title { font-size: 16px; font-weight: 700; text-transform: uppercase; }
  .modal-close { background: none; border: none; color: var(--text-tertiary); cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: all 0.15s; }
  .modal-close:hover { background: var(--surface-muted); color: var(--text); }
  .modal-body { padding: 24px; }
  .offer { padding: 16px; background: var(--surface-muted); border-radius: 8px; border-left: 3px solid var(--accent); margin-bottom: 12px; }
  .offer-top { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .offer-body { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
  .offer-actions { display: flex; gap: 8px; }
  .activity { display: flex; flex-direction: column; gap: 10px; }
  .activity-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface-muted); border-radius: 8px; font-size: 13px; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-quaternary); flex-shrink: 0; }
  .activity-dot.red { background: var(--accent); }
  .activity-dot.green { background: var(--positive); }
  .activity-dot.amber { background: var(--warning); }
  .section-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .hidden { display: none !important; }
  .mb-20 { margin-bottom: 20px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .mail-app { grid-template-columns: 1fr; height: auto; }
    .mail-folders, .mail-list { display: none; }
    .section-grid { grid-template-columns: 1fr; }
    .attr-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-mark"></div>
      <div class="login-title">Be The Grid</div>
    </div>
    <p class="login-sub">Driver and team principal portal</p>
    <div class="field">
      <label>Username</label>
      <input type="text" placeholder="username" id="login-user" value="maxverstappen">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" placeholder="password" id="login-pass" value="password">
    </div>
    <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Log in
    </button>
  </div>
</div>

<div class="app hidden" id="app">
  <aside class="sidebar">
    <div class="nav-item active" onclick="showView('overview')" data-view="overview">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      Overview
    </div>
    <div class="nav-item" onclick="showView('drivers')" data-view="drivers">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Drivers
    </div>
    <div class="nav-item" onclick="showView('attributes')" data-view="attributes">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Attributes
    </div>
    <div class="nav-item" onclick="showView('mail')" data-view="mail">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      Mailbox
      <span class="nav-badge">3</span>
    </div>
    <div class="nav-item" onclick="showView('contracts')" data-view="contracts">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Contracts
    </div>
    <div class="nav-item" onclick="showView('admin')" data-view="admin">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Admin
    </div>
    <div class="nav-item" onclick="showView('account')" data-view="account">

<script>
  const demoDriver = {
    name: "Max Verstappen", number: "1", nation: "NED", team: "Red Bull Racing",
    teamColor: "220,40,50", ovr: 94.2, targetOvr: 96.0, aggression: 65, aggressionLocked: false,
    attributes: { cornering: 96, braking: 94, reactions: 95, accuracy: 93, control: 92, smoothness: 88, overtaking: 91, defending: 95 }
  };

  const demoMail = [
    { id: 1, folder: "inbox", sender: "Red Bull Racing", subject: "Contract extension 2027", preview: "We would like to discuss extending your contract through 2028...", date: "2 min ago", unread: true,
      body: "Dear Max,\n\nWe would like to discuss extending your contract through 2028 with improved terms reflecting your continued dominance in the championship.\n\nOur offer:\n• Base salary: $55M annually\n• Performance bonuses: $5M per championship\n• Image rights: 60% retained\n\nPlease let us know your thoughts.\n\nBest regards,\nChristian Horner\nTeam Principal" },
    { id: 2, folder: "inbox", sender: "FIA", subject: "Super license renewal", preview: "Your super license renewal for the 2027 season is now due...", date: "1 hour ago", unread: true,
      body: "Dear Max Verstappen,\n\nYour super license renewal for the 2027 season is now due. Please complete the attached forms and submit payment before December 31st.\n\nRegards,\nFIA Administration" },
    { id: 3, folder: "inbox", sender: "Helmut Marko", subject: "Driver development program", preview: "Review of junior drivers for the 2027 season...", date: "3 hours ago", unread: true,
      body: "Max,\n\nReview of junior drivers for the 2027 season. We have identified two promising candidates from F2 that could serve as reserve drivers.\n\nLet me know if you want to review their telemetry data.\n\nHelmut" },
    { id: 4, folder: "inbox", sender: "Mercedes-AMG F1", subject: "Exploratory discussion", preview: "We understand your contract situation and would welcome a conversation...", date: "Yesterday", unread: false,
      body: "Dear Max,\n\nWe understand your contract situation and would welcome a conversation about potential opportunities with Mercedes-AMG Petronas F1 Team.\n\nToto Wolff" },
    { id: 5, folder: "inbox", sender: "Pirelli", subject: "Tire test schedule — Spa", preview: "Please confirm your availability for the upcoming tire test...", date: "Aug 15", unread: false,
      body: "Dear Max,\n\nPlease confirm your availability for the upcoming tire test at Spa-Francorchamps on August 28–29.\n\nBest,\nMario Isola" },
    { id: 6, folder: "sent", sender: "You", subject: "Re: Contract extension 2027", preview: "Thank you for the offer. I would like to discuss the bonus structure...", date: "1 min ago", unread: false,
      body: "Christian,\n\nThank you for the offer. I would like to discuss the bonus structure in more detail before committing.\n\nMax" },
    { id: 7, folder: "trash", sender: "Spam", subject: "Win a free paddock pass", preview: "Click here to claim your prize...", date: "Aug 12", unread: false, body: "This is spam. Please do not click any links." }
  ];

  let currentView = "overview", selectedMailId = 1, currentFolder = "inbox", pending = {}, aggrValue = demoDriver.aggression;

  function doLogin() {
    document.getElementById("login-wrap").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    renderView();
  }
  function showView(view) {
    currentView = view;
    document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === view));
    renderView();
  }
  function renderView() {
    const main = document.getElementById("main");
    switch(currentView) {
      case "overview": renderOverview(main); break;
      case "drivers": renderDrivers(main); break;
      case "attributes": renderAttributes(main); break;
      case "mail": renderMail(main); break;
      case "contracts": renderContracts(main); break;
      case "admin": renderAdmin(main); break;
      case "account": renderAccount(main); break;
    }
  }

  function renderOverview(el) {
    el.innerHTML = `
      <div class="header">
        <div class="header-left"><div class="header-mark"></div><div class="header-title">Dashboard</div></div>
        <div class="header-right">
          <div class="pill"><span class="pill-dot"></span>August 2026</div>
          <div class="pill">$55M salary</div>
        </div>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-value" style="color:var(--accent-hot)">${demoDriver.ovr.toFixed(1)}</div><div class="stat-label">Current OVR</div></div>
        <div class="stat"><div class="stat-value">${demoDriver.targetOvr.toFixed(1)}</div><div class="stat-label">Target OVR</div></div>
        <div class="stat"><div class="stat-value">P1</div><div class="stat-label">Championship</div></div>
        <div class="stat"><div class="stat-value">387</div><div class="stat-label">Season points</div></div>
      </div>
      <div class="section-grid">
        <div class="card">
          <div class="card-header"><div class="card-title">Recent activity</div></div>
          <div class="activity">
            <div class="activity-item"><div class="activity-dot red"></div><div><div style="font-weight:600">Contract offer received</div><div style="font-size:12px;color:var(--text-quaternary)">Red Bull Racing · 2 min ago</div></div></div>
            <div class="activity-item"><div class="activity-dot green"></div><div><div style="font-weight:600">Attribute upgrade applied</div><div style="font-size:12px;color:var(--text-quaternary)">Defending +1 · Yesterday</div></div></div>
            <div class="activity-item"><div class="activity-dot amber"></div><div><div style="font-weight:600">Salary payment processed</div><div style="font-size:12px;color:var(--text-quaternary)">$708K · August 1st</div></div></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">Team standing</div></div>
          <table class="table">
            <thead><tr><th>Pos</th><th>Driver</th><th>Pts</th></tr></thead>
            <tbody>
              <tr><td>1</td><td class="col-strong">M. Verstappen</td><td>387</td></tr>
              <tr><td>2</td><td class="col-strong">L. Hamilton</td><td>234</td></tr>
              <tr><td>3</td><td class="col-strong">L. Norris</td><td>198</td></tr>
            </tbody>
          </table>
        </div>
      </div>`;
  }

  function renderDrivers(el) {
    el.innerHTML = `
      <div class="header"><div class="header-left"><div class="header-mark"></div><div class="header-title">Driver profile</div></div></div>
      <div class="hero">
        <div class="hero-photo"><span style="font-size:32px">🏎</span><div class="hero-number">${demoDriver.number}</div></div>
        <div>
          <div class="hero-name">${demoDriver.name}</div>
          <div class="hero-meta">
            <span class="tag">${demoDriver.team}</span>
            <span style="font-family:var(--font-mono);font-size:12px;">${demoDriver.nation}</span>
            <span style="color:var(--text-tertiary)">#${demoDriver.number}</span>
          </div>
        </div>
      </div>
      <div class="stats-grid" style="margin-bottom:20px;">
        <div class="stat"><div class="stat-value" style="color:var(--accent-hot)">${demoDriver.ovr.toFixed(1)}</div><div class="stat-label">Overall rating</div></div>
        <div class="stat"><div class="stat-value">${demoDriver.attributes.cornering}</div><div class="stat-label">Highest skill</div></div>
        <div class="stat"><div class="stat-value">94.2</div><div class="stat-label">Live OVR</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Season statistics</div></div>
        <table class="table">
          <thead><tr><th>Grand Prix</th><th>Quali</th><th>Race</th><th>Pts</th></tr></thead>
          <tbody>
            <tr><td class="col-strong">Belgium</td><td>P1</td><td>P1</td><td>25</td></tr>
            <tr><td class="col-strong">Hungary</td><td>P2</td><td>P1</td><td>25</td></tr>
            <tr><td class="col-strong">Netherlands</td><td>P1</td><td>P3</td><td>15</td></tr>
            <tr><td class="col-strong">Italy</td><td>P1</td><td>P1</td><td>25</td></tr>
          </tbody>
        </table>
      </div>`;
  }

  function renderAttributes(el) {
    const groups = [
      { label: "Pace", skills: [{key:"cornering",name:"Cornering",w:20},{key:"braking",name:"Braking",w:18},{key:"reactions",name:"Reactions",w:11}] },
      { label: "Consistency", skills: [{key:"accuracy",name:"Accuracy",w:15},{key:"control",name:"Control",w:14},{key:"smoothness",name:"Smoothness",w:5}] },
      { label: "Racecraft", skills: [{key:"overtaking",name:"Overtaking",w:8},{key:"defending",name:"Defending",w:7}] }
    ];
    let live = demoDriver.ovr;
    Object.keys(pending).forEach(k => live += (pending[k]||0) * 0.15);
    let html = `
      <div class="header"><div class="header-left"><div class="header-mark"></div><div class="header-title">Attributes</div></div></div>
      <div class="stats-grid" style="margin-bottom:20px;">
        <div class="stat"><div class="stat-value">${demoDriver.ovr.toFixed(1)}</div><div class="stat-label">Current OVR</div></div>
        <div class="stat"><div class="stat-value" style="color:var(--accent-hot)">${live.toFixed(1)}</div><div class="stat-label">Live OVR</div></div>
        <div class="stat"><div class="stat-value">${demoDriver.targetOvr.toFixed(1)}</div><div class="stat-label">Target OVR</div></div>
      </div>
      <div class="attr-grid">`;
    groups.forEach(g => {
      html += `<div class="attr-group"><div class="attr-head">${g.label}</div>`;
      g.skills.forEach(s => {
        const val = demoDriver.attributes[s.key], del = pending[s.key] || 0, pct = (val / 99) * 100;
        html += `
          <div class="attr-row">
            <div><div class="attr-name">${s.name}</div><div class="attr-weight">Weight ${s.w}%</div></div>
            <div class="attr-right">
              <div class="attr-bar"><div class="attr-bar-fill" style="width:${pct}%"></div></div>
              <div class="attr-val">${val}</div>
              <div class="attr-delta" id="d-${s.key}">${del ? '+'+del : ''}</div>
              <div class="stepper">
                <button onclick="adj('${s.key}',-1)" id="m-${s.key}" style="visibility:${del?'visible':'hidden'}">−</button>
                <button onclick="adj('${s.key}',1)" id="p-${s.key}" class="plus">+</button>
              </div>
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
    const aggrLabel = aggrValue < 34 ? "Low" : aggrValue < 67 ? "Medium" : "High";
    const aggrColor = aggrValue < 34 ? "var(--positive)" : aggrValue < 67 ? "var(--warning)" : "var(--danger)";
    html += `
      <div class="aggr">
        <div class="aggr-top">
          <div class="aggr-level" id="aggr-label" style="color:${aggrColor}">${aggrLabel}</div>
          <div class="aggr-num"><span id="aggr-num">${aggrValue}</span>/100</div>
        </div>
        <div class="slider-track" onclick="setAggr(event)">
          <div class="slider-fill" id="aggr-fill" style="width:${aggrValue}%"></div>
          <div class="slider-thumb" id="aggr-thumb" style="left:${aggrValue}%"></div>
        </div>
        <div class="slider-labels">
          <span style="color:var(--positive)">Low</span>
          <span style="color:var(--warning)">Medium</span>
          <span style="color:var(--danger)">High</span>
        </div>
        <div class="aggr-warn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div><strong>This is permanent.</strong> Once committed, aggression can never be changed again.</div>
        </div>
        <div class="aggr-commit">
          <button class="btn btn-primary" onclick="commitAggr()">Commit aggression</button>
        </div>
      </div>`;
    el.innerHTML = html;
  }

  function adj(key, dir) {
    if (!pending[key]) pending[key] = 0;
    if (dir > 0) pending[key]++; else if (pending[key] > 0) pending[key]--;
    renderView();
  }
  function setAggr(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    aggrValue = Math.max(0, Math.min(100, Math.round(((e.clientX - rect.left) / rect.width) * 100)));
    renderView();
  }
  function commitAggr() {
    alert("Aggression committed as " + (aggrValue < 34 ? "Low" : aggrValue < 67 ? "Medium" : "High") + ". This cannot be changed again.");
  }

  function renderMail(el) {
    const folders = [
      { id: "inbox", label: "Inbox", count: demoMail.filter(m => m.folder === "inbox" && m.unread).length },
      { id: "sent", label: "Sent", count: 0 },
      { id: "trash", label: "Trash", count: 0 }
    ];
    const list = demoMail.filter(m => m.folder === currentFolder);
    const sel = demoMail.find(m => m.id === selectedMailId) || list[0];
    let html = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <div class="header-left"><div class="header-mark"></div><div class="header-title">Mailbox</div></div>
        <button class="btn btn-primary btn-sm" onclick="openCompose()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Compose
        </button>
      </div>
      <div class="mail-app">
        <div class="mail-folders">`;
    folders.forEach(f => {
      html += `<div class="folder ${f.id===currentFolder?'active':''}" onclick="setFolder('${f.id}')"><span>${f.label}</span>${f.count>0?`<span class="folder-count">${f.count}</span>`:''}</div>`;
    });
    html += `</div><div class="mail-list"><div class="mail-search"><input type="text" placeholder="Search mail..."></div>`;
    list.forEach(m => {
      html += `
        <div class="mail-item ${m.unread?'unread':''} ${m.id===selectedMailId?'active':''}" onclick="selectMail(${m.id})">
          <div class="mail-item-top">
            <span class="mail-sender">${m.sender}</span>
            <span class="mail-date">${m.date}</span>
          </div>
          <div class="mail-subj">${m.subject}</div>
          <div class="mail-preview">${m.preview}</div>
        </div>`;
    });
    html += `</div><div class="mail-read">`;
    if (sel) {
      html += `
        <div class="read-header">
          <div class="read-subj">${sel.subject}</div>
          <div class="read-meta">
            <div class="read-avatar">${sel.sender.charAt(0)}</div>
            <div>
              <div style="font-weight:600;color:var(--text)">${sel.sender}</div>
              <div style="font-size:12px;color:var(--text-quaternary)">To: You · ${sel.date}</div>
            </div>
          </div>
        </div>
        <div class="read-body">${sel.body.replace(/\n/g,'<br>')}</div>
        <div class="read-actions">
          <button class="btn btn-sm btn-ghost">Reply</button>
          <button class="btn btn-sm btn-ghost">Forward</button>
          <button class="btn btn-sm btn-ghost" style="margin-left:auto;color:var(--accent-hot)">Delete</button>
        </div>`;
    }
    html += `</div></div>`;
    el.innerHTML = html;
  }

  function setFolder(f) { currentFolder = f; renderView(); }
  function selectMail(id) { selectedMailId = id; const m = demoMail.find(x => x.id === id); if (m) m.unread = false; renderView(); }
  function openCompose() { document.getElementById("compose-modal").classList.add("open"); }
  function closeCompose() { document.getElementById("compose-modal").classList.remove("open"); }
  function sendCompose() {
    const to = document.getElementById("compose-to").value;
    const subj = document.getElementById("compose-subj").value;
    if (to && subj) {
      demoMail.unshift({ id: Date.now(), folder: "sent", sender: "You", subject: subj, preview: document.getElementById("compose-body").value.substring(0,60)+"...", date: "Just now", unread: false, body: document.getElementById("compose-body").value });
      closeCompose(); currentFolder = "sent"; selectedMailId = demoMail[0].id; renderView();
    }
  }

  function renderContracts(el) {
    el.innerHTML = `
      <div class="header"><div class="header-left"><div class="header-mark"></div><div class="header-title">Contracts</div></div></div>
      <div class="card mb-20">
        <div class="card-header"><div class="card-title">Active contracts</div></div>
        <table class="table">
          <thead><tr><th>Team</th><th>Driver</th><th>Salary</th><th>Period</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td class="col-strong">Red Bull Racing</td><td>Max Verstappen</td><td>$55M</td><td>2025–2028</td><td><span class="tag tag-success">Active</span></td></tr>
            <tr><td class="col-strong">Red Bull Racing</td><td>Sergio Perez</td><td>$14M</td><td>2024–2026</td><td><span class="tag tag-success">Active</span></td></tr>
          </tbody>
        </table>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title">Pending offers</div></div>
        <div class="offer">
          <div class="offer-top"><span style="font-weight:600">Red Bull Racing → Max Verstappen</span><span style="font-size:12px;color:var(--text-tertiary)">2 min ago</span></div>
          <div class="offer-body">Extension offer through 2028 with $55M base salary and performance bonuses.</div>
          <div class="offer-actions">
            <button class="btn btn-primary btn-sm">Accept</button>
            <button class="btn btn-ghost btn-sm">Decline</button>
            <button class="btn btn-ghost btn-sm">Counter</button>
          </div>
        </div>
        <div class="offer" style="border-left-color:var(--warning)">
          <div class="offer-top"><span style="font-weight:600">Mercedes-AMG F1 → Max Verstappen</span><span style="font-size:12px;color:var(--text-tertiary)">Yesterday</span></div>
          <div class="offer-body">Exploratory offer for 2027 season. Terms to be discussed.</div>
          <div class="offer-actions">
            <button class="btn btn-primary btn-sm">Accept</button>
            <button class="btn btn-ghost btn-sm">Decline</button>
            <button class="btn btn-ghost btn-sm">Counter</button>
          </div>
        </div>
      </div>`;
  }

  function renderAdmin(el) {
    el.innerHTML = `
      <div class="header"><div class="header-left"><div class="header-mark"></div><div class="header-title">Admin tools</div></div></div>
      <div class="card mb-20">
        <div class="card-header"><div class="card-title">Create new driver</div></div>
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:16px;">New drivers start at 70 in every rating, with 0 upgrade points.</p>
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;">
          <div class="field" style="margin-bottom:0;"><label>Driver name</label><input type="text" placeholder="e.g. Eetu Vaisanen"></div>
          <div class="field" style="margin-bottom:0;"><label>Nation</label><input type="text" placeholder="e.g. FIN"></div>
          <button class="btn btn-primary">Create</button>
        </div>
      </div>
      <div class="card mb-20">
        <div class="card-header"><div class="card-title">Create driver login</div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:16px;align-items:end;">
          <div class="field" style="margin-bottom:0;"><label>Driver</label><select><option>— choose a driver —</option><option>Max Verstappen</option></select></div>
          <div class="field" style="margin-bottom:0;"><label>Username</label><input type="text" placeholder="username"></div>

        <div class="card-header"><div class="card-title">Season clock</div></div>

          <button class="btn btn-primary">Next month →</button>

  function renderAccount(el) {
    el.innerHTML = `
      <div class="header"><div class="header-left"><div class="header-mark"></div><div class="header-title">Account settings</div></div></div>
      <div class="card">
        <div class="card-header"><div class="card-title">Change credentials</div></div>
